function calcItems(items){
  let sub=0, gt=0
  const lines=(items||[]).map(it=>{
    const a=(+it.qty||0)*(+it.rate||0), disc=a*((+it.discount||0)/100), tax=a-disc, ga=tax*((+it.gst||0)/100)
    sub+=tax; gt+=ga; return{...it,a,disc,tax,ga,tot:tax+ga}
  })
  const cgst=gt/2, sgst=gt/2
  return {lines, sub, gt, cgst, sgst, grand:sub+gt}
}

function toWords(n){
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen']
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety']
  if(!n||n===0) return 'Zero'
  function w(x){
    if(x<20)return a[x]; if(x<100)return b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'')
    if(x<1000)return a[Math.floor(x/100)]+' Hundred'+(x%100?' '+w(x%100):'')
    if(x<100000)return w(Math.floor(x/1000))+' Thousand'+(x%1000?' '+w(x%1000):'')
    if(x<10000000)return w(Math.floor(x/100000))+' Lakh'+(x%100000?' '+w(x%100000):'')
    return w(Math.floor(x/10000000))+' Crore'+(x%10000000?' '+w(x%10000000):'')
  }
  const r=Math.floor(n), p=Math.round((n-r)*100)
  return w(r)+' Rupee'+(r!==1?'s':'')+(p>0?' and '+w(p)+' Paise':'')+' Only'
}

function fyOf(date){
  const pts=(date||today()).split('-')
  const yr=parseInt(pts[0]),mo=parseInt(pts[1])
  const s=mo>=4?yr:yr-1
  return{start:s,str:`${s}-${String(s+1).slice(-2)}`}
}
function buildInvNo(settings,inv){
  const pfx=settings.invoicePrefix||'FRA'
  const{str}=fyOf(inv.date)

}

    const{data:d,error:e}=await sb.from('invoices').update({payment_status:ps}).eq('id',id).select().single(); if(e)throw e
    const r=toCamel(d); setD(p=>({...p,invoices:p.invoices.map(i=>i.id===id?r:i)}))
  }),[])
  const delInvoice=useCallback(async id=>op(async()=>{
    const{data:old}=await sb.from('invoices').select('items').eq('id',id).single()
    const{error:e}=await sb.from('invoices').delete().eq('id',id); if(e)throw e
    setD(p=>({...p,invoices:p.invoices.filter(i=>i.id!==id)}))
    await adjParts(old?.items||[],[])
  }),[])

  // ── Settings
  const saveSettings=useCallback(async form=>op(async()=>{
    const row=toSnake(form); row.id=1
    const{data:d,error:e}=await sb.from('settings').upsert(row).select().single(); if(e)throw e
    const r=toCamel(d); setD(p=>({...p,settings:r})); return r
  }),[])

  return{D,ready,busy,err,reload:load,saveCustomer,delCustomer,saveVehicle,delVehicle,savePart,delPart,saveJob,delJob,saveInvoice,markPay,delInvoice,saveSettings}
}

/* ─── LINE ITEM EDITOR ──────────────────────────────── */
function LineEd({items,setItems,parts,gstType}){
  const add=svc=>setItems(p=>[...p,{id:Date.now()+Math.random(),name:'',qty:1,rate:0,gst:18,discount:0,hsnSac:'',isService:svc}])
  const upd=(id,k,v)=>setItems(p=>p.map(x=>x.id===id?{...x,[k]:v}:x))
  function fill(id,name){
    const p2=parts.find(p=>p.name===name)
    if(p2){setItems(pr=>pr.map(x=>x.id===id?{...x,name,partId:p2.id,rate:+p2.sellingPrice||0,gst:+p2.gst||18,hsnSac:p2.hsnCode||''}:x));return}
    const sv=SERVICES.find(s=>s.n===name)
    if(sv){setItems(pr=>pr.map(x=>x.id===id?{...x,name,rate:sv.r,gst:sv.g,hsnSac:sv.s}:x));return}
    upd(id,'name',name)
  }
  const{lines,sub,gt,grand}=calcItems(items)
  const ith={padding:'6px 5px',textAlign:'left',fontWeight:700,fontSize:11,background:'#f0f4f8',borderBottom:'2px solid #e0e7ef',color:'#444',whiteSpace:'nowrap'}
  const itd={padding:'5px 5px',fontSize:11,borderBottom:'1px solid #f0f4f8',verticalAlign:'middle'}
  const ii={padding:'4px 6px',border:'1px solid #d0d7de',borderRadius:5,fontSize:11,fontFamily:'inherit',background:'#fff',outline:'none'}
  return <div>
    <div style={{display:'flex',gap:8,marginBottom:10}}>
      <button onClick={()=>add(false)} style={{padding:'6px 14px',background:'#e3f2fd',color:'#0d47a1',border:'1px solid #90caf9',borderRadius:7,cursor:'pointer',fontSize:11,fontWeight:700}}>+ Add Part</button>
      <button onClick={()=>add(true)} style={{padding:'6px 14px',background:'#e8f5e9',color:'#1b5e20',border:'1px solid #a5d6a7',borderRadius:7,cursor:'pointer',fontSize:11,fontWeight:700}}>+ Add Labour / Service</button>
    </div>
    {items.length>0&&<div style={{overflowX:'auto',marginBottom:8}}>
      <table style={{minWidth:740,borderCollapse:'collapse',width:'100%'}}>
        <thead><tr>{['#','Description','HSN/SAC','Qty','Rate (₹)','Disc %','GST %','Taxable','CGST','SGST','Total',''].map((h,i)=><th key={i} style={ith}>{h}</th>)}</tr></thead>
        <tbody>{lines.map((it,i)=><tr key={it.id} style={{background:it.isService?'#f8fff8':'#fff'}}>
          <td style={{...itd,color:'#aaa',width:22,textAlign:'center'}}>{i+1}</td>
          <td style={{...itd,minWidth:160}}>
            <input list={`dl${it.id}`} value={it.name} onChange={e=>fill(it.id,e.target.value)} placeholder={it.isService?'Service name':'Part name'} style={{...ii,width:'100%',minWidth:140}}/>
            <datalist id={`dl${it.id}`}>{(it.isService?SERVICES.map(s=>({n:s.n})):[...parts.map(p=>({n:p.name})),...SERVICES]).map(p=><option key={p.n} value={p.n}/>)}</datalist>
          </td>
          <td style={itd}><input value={it.hsnSac||''} onChange={e=>upd(it.id,'hsnSac',e.target.value)} style={{...ii,width:80,fontFamily:'monospace',fontSize:10}}/></td>
          <td style={itd}><input type="number" value={it.qty} onChange={e=>upd(it.id,'qty',+e.target.value)} min={0} style={{...ii,width:50}}/></td>
          <td style={itd}><input type="number" value={it.rate} onChange={e=>upd(it.id,'rate',+e.target.value)} min={0} style={{...ii,width:76}}/></td>
          <td style={itd}><input type="number" value={it.discount||0} onChange={e=>upd(it.id,'discount',+e.target.value)} min={0} max={100} style={{...ii,width:44}}/></td>
          <td style={itd}><select value={it.gst} onChange={e=>upd(it.id,'gst',+e.target.value)} style={{...ii,width:56}}>{[0,5,12,18,28].map(r=><option key={r} value={r}>{r}%</option>)}</select></td>
          <td style={{...itd,textAlign:'right',color:'#555'}}>{fmt(it.tax)}</td>
          <td style={{...itd,textAlign:'right',color:'#388e3c'}}>{fmt(it.ga/2)}</td>
          <td style={{...itd,textAlign:'right',color:'#388e3c'}}>{fmt(it.ga/2)}</td>
          <td style={{...itd,fontWeight:800,textAlign:'right',color:'#1565c0'}}>{fmt(it.tot)}</td>
          <td style={itd}><button onClick={()=>setItems(p=>p.filter(x=>x.id!==it.id))} style={{border:'none',background:'none',color:'#e53935',cursor:'pointer',fontSize:18,padding:'0 4px'}}>×</button></td>
        </tr>)}</tbody>
      </table>
    </div>}
    {items.length===0&&<div style={{textAlign:'center',padding:20,color:'#aaa',fontSize:12,border:'1px dashed #d0d7de',borderRadius:8}}>No items yet. Add a part or labour above.</div>}
    <div style={{display:'flex',justifyContent:'flex-end',marginTop:12}}>
      <div style={{width:280,fontSize:12}}>
        {(gstType==='igst'?[['Subtotal (taxable)',sub],['IGST',gt],['Total GST',gt]]:[['Subtotal (taxable)',sub],['CGST',gt/2],['SGST',gt/2],['Total GST',gt]]).map(([l,v])=><div key={l} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid #f0f0f0'}}><span style={{color:'#888'}}>{l}</span><span>{fmt(v)}</span></div>)}
        <div style={{display:'flex',justifyContent:'space-between',padding:'8px 0',fontWeight:800,fontSize:17,color:'#1565c0'}}><span>Grand Total</span><span>{fmt(grand)}</span></div>
      </div>
    </div>
  </div>
}

          {isIGST?<td style={{...cell,textAlign:'right',fontWeight:700}}>₹{gt.toFixed(2)}</td>:<React.Fragment><td style={{...cell,textAlign:'right',fontWeight:700}}>₹{(gt/2).toFixed(2)}</td><td style={{...cell,textAlign:'right',fontWeight:700}}>₹{(gt/2).toFixed(2)}</td></React.Fragment>}
          <td style={{...cell,textAlign:'right',fontWeight:800,color:'#1565c0'}}>₹{sub.toFixed(2)}</td>
        </tr>
      </tfoot>
    </table>
    {/* AMOUNT IN WORDS + SUBTOTALS */}
    <table style={{width:'100%',borderCollapse:'collapse',border:'1px solid #333',borderTop:'none'}}>
      <tbody><tr>
        <td style={{...cell,width:'55%',borderRight:'1px solid #333'}}>
          <div style={{fontWeight:700,fontSize:11,marginBottom:5}}>Amount in Words:<br/><span style={{fontWeight:400,fontStyle:'italic'}}>{toWords(fg)}</span></div>
          <div style={{fontWeight:700,fontSize:11,marginTop:8}}>Bank Details</div>
        </td>
        <td style={cell}>
          {(isIGST?[['Item Discount:',itemDiscountTotal],['Subtotal (taxable):',sub],[igstH+':',gt],['Total Tax:',gt],['Extra Discount:',inv.additionalDiscount||0],['Adjustment:',inv.adjustment||0]]:[['Item Discount:',itemDiscountTotal],['Subtotal (taxable):',sub],[cgstH+':',gt/2],[sgstH+':',gt/2],['Total Tax:',gt],['Extra Discount:',inv.additionalDiscount||0],['Adjustment:',inv.adjustment||0]]).map(([l,v])=><div key={l} style={{display:'flex',justifyContent:'space-between',padding:'3px 0'}}><span>{l}</span><span style={{fontWeight:700}}>₹{Number(v).toFixed(2)}</span></div>)}
        </td>
      </tr></tbody>
    </table>
    {/* BANK + GRAND TOTAL */}
    <table style={{width:'100%',borderCollapse:'collapse',border:'1px solid #333',borderTop:'none'}}>
      <thead><tr>
        {['#','Bank Name','Account No','IFSC Code','Branch'].map(h=><th key={h} style={hcell}>{h}</th>)}
        <th style={{...hcell,textAlign:'right',fontSize:11}}>Grand Total: ₹{fg.toFixed(2)}</th>
      </tr></thead>
      <tbody><tr>
        <td style={{...cell,textAlign:'center'}}>1</td>
        <td style={cell}>{settings.bankName}</td>
        <td style={{...cell,textAlign:'center'}}>{settings.accountNo}</td>
        <td style={{...cell,textAlign:'center'}}>{settings.ifsc}</td>
        <td style={cell}>{settings.bankBranch||''}</td>
        <td style={cell}></td>
      </tr></tbody>
    </table>
    {/* SIGNATURES */}
    <table style={{width:'100%',borderCollapse:'collapse',border:'1px solid #333',borderTop:'none'}}>
      <tbody>
        <tr><td colSpan={3} style={{...cell,fontStyle:'italic',color:'#444',lineHeight:1.6}}>I certify that the work has been done to my satisfaction and that I have taken delivery of the vehicle in good condition, with all items / valuables and parts intact</td></tr>
        <tr>
          {['Customer / Authorized Signatory','Service Advisor Signature','Cashier / Authorized Signature'].map((s,i)=><td key={i} style={{...cell,textAlign:'center',height:60,borderRight:i<2?'1px solid #333':'none'}}><div style={{borderTop:'1px solid #333',marginTop:40,paddingTop:4}}>{s}</div></td>)}
        </tr>
      </tbody>
    </table>
    {/* TERMS */}
    {(inv.termsConditions||settings.invoiceTerms)&&<table style={{width:'100%',borderCollapse:'collapse',border:'1px solid #333',borderTop:'none'}}><tbody><tr><td style={cell}><b>Terms &amp; Conditions:</b><div style={{whiteSpace:'pre-wrap',marginTop:4,lineHeight:1.6,color:'#333'}}>{inv.termsConditions||settings.invoiceTerms}</div></td></tr></tbody></table>}
    {inv.notes&&<table style={{width:'100%',borderCollapse:'collapse',border:'1px solid #333',borderTop:'none'}}><tbody><tr><td style={cell}><b>Notes: </b>{inv.notes}</td></tr></tbody></table>}
    </div>
    <div className="np" style={{display:'flex',gap:8,justifyContent:'center',marginTop:16}}>
      <GBtn onClick={onClose}>Close</GBtn>
      <PBtn onClick={doPrint}>🖨 Print / Save PDF</PBtn>
    </div>
  </div>
}

/* ─── INVOICE EDITOR (all fields editable) ──────────── */
function InvEditor({initial,data,onSave,onClose}){
  const blank={type:'invoice',gstType:'cgst_sgst',date:today(),dueDate:'',jobCardId:'',customerId:'',vehicleId:'',customerName:'',companyName:'',customerPhone:'',customerAddress:'',customerGstin:'',customerEmail:'',vehicleReg:'',vehicleDetails:'',odometer:'',vinNo:'',engineNo:'',vehicleColor:'',vehicleFuel:'',items:[],notes:'',termsConditions:'',paymentStatus:'pending',paymentMethod:'',amountPaid:0,additionalDiscount:0,adjustment:0}
  const[form,setForm]=useState(initial?{...blank,...initial}:blank)
  const[items,setItems]=useState(initial?.items||[])
  const[aiLoading,setAiLoading]=useState(false)
  const pdfRef=useRef(null)
  const f=(k,v)=>setForm(p=>({...p,[k]:v}))
  const custVehs=data.vehicles.filter(v=>v.customerId==form.customerId)

  async function importFromPDF(file){
    setAiLoading(true)
    try{
      const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file)})
      const {data,error}=await sb.functions.invoke('anthropic-proxy',{
        body:{
          model:'claude-haiku-4-5-20251001',max_tokens:1500,
          messages:[{role:'user',content:[
            {type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},
            {type:'text',text:`Extract details from this invoice/document. Return ONLY a JSON object, no explanation:\n{"customerName":"","companyName":"","customerPhone":"","customerEmail":"","customerAddress":"","customerGstin":"","vehicleReg":"","vehicleDetails":"","vinNo":"","engineNo":"","vehicleColor":"","vehicleFuel":"petrol","odometer":null,"date":"YYYY-MM-DD","notes":"","items":[{"name":"","qty":1,"rate":0,"gst":18,"hsnSac":"","discount":0,"isService":false}]}\nUse null for missing numbers, empty string for missing text. isService=true for labour/service items. vehicleFuel must be one of: petrol, diesel, cng, electric, hybrid.`}
          ]}]
        }
      })
      if(error) throw new Error(error.message||'Edge Function not set up. See Settings → AI Setup.')
      if(!data?.content?.length) throw new Error(data?.error?.message||data?.error?.type||'Unexpected AI response — make sure your Edge Function includes the anthropic-beta: pdfs-2024-09-25 header (see Settings → AI Setup).')
      const text=data.content[0].text
      const json=JSON.parse(text.match(/\{[\s\S]*\}/)[0])
      const upd={};['customerName','companyName','customerPhone','customerEmail','customerAddress','customerGstin','vehicleReg','vehicleDetails','vinNo','engineNo','vehicleColor','vehicleFuel','notes'].forEach(k=>{if(json[k])upd[k]=json[k]})
      if(json.odometer) upd.odometer=json.odometer
      if(json.date&&json.date.match(/^\d{4}-\d{2}-\d{2}$/)) upd.date=json.date
      setForm(p=>({...p,...upd}))
      if(json.items?.length) setItems(json.items.map(it=>({id:Date.now()+Math.random(),name:it.name||'',qty:+it.qty||1,rate:+it.rate||0,gst:+it.gst||18,hsnSac:it.hsnSac||'',discount:+it.discount||0,isService:!!it.isService})))
      alert(`✓ AI extracted ${json.items?.length||0} item(s). Please review before saving.`)
    }catch(e){alert('AI import failed: '+e.message)}
    setAiLoading(false)
  }

  function pickC(id){
    const c=data.customers.find(x=>x.id==id); if(!c)return
    setForm(p=>({...p,customerId:id,customerName:c.name||p.customerName,companyName:c.companyName||'',customerPhone:c.phone||p.customerPhone,customerAddress:c.address||p.customerAddress,customerGstin:c.gstin||p.customerGstin,customerEmail:c.email||p.customerEmail}))
  }
  function pickV(id){
    const v=data.vehicles.find(x=>x.id==id); if(!v)return
    setForm(p=>({...p,vehicleId:id,vehicleReg:v.regNo||p.vehicleReg,vehicleDetails:`${v.make} ${v.model} ${v.variant||''} ${v.year||''}`.trim().replace(/\s+/g,' ')||p.vehicleDetails,odometer:v.odometer||p.odometer,vinNo:v.vin||p.vinNo,engineNo:v.engineNo||p.engineNo,vehicleColor:v.color||p.vehicleColor,vehicleFuel:v.fuelType||p.vehicleFuel}))
  }
  const{sub,gt,grand}=calcItems(items)
  const finalTotal=(grand-(form.additionalDiscount||0))+(form.adjustment||0)
  function doSave(){
    const{sub:s,gt:g,cgst:cg,sgst:sg,grand:gr}=calcItems(items)
    const fg=gr-(form.additionalDiscount||0)+(form.adjustment||0)
    const ni=v=>v===''||v==null?null:+v
    onSave({...form,jobCardId:ni(form.jobCardId),customerId:ni(form.customerId),vehicleId:ni(form.vehicleId),odometer:ni(form.odometer),items,subtotal:s,gstTot:g,cgstTot:cg,sgstTot:sg,grand:fg})
  }
  const sec={border:'1px solid #e8ecf0',borderRadius:8,padding:14,marginBottom:14,background:'#fafbfc'}
  const stl={fontSize:12,fontWeight:800,color:'#1565c0',marginBottom:12,paddingBottom:8,borderBottom:'1px solid #e8ecf0'}
  return <div>
    <div style={{background:'linear-gradient(135deg,#e8f5e9,#e3f2fd)',border:'1px solid #90caf9',borderRadius:8,padding:'10px 14px',marginBottom:14,display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
      <div style={{flex:1,minWidth:180}}>
        <div style={{fontWeight:800,fontSize:12,color:'#1565c0',marginBottom:2}}>🤖 AI Auto-Fill from PDF</div>
        <div style={{fontSize:11,color:'#555'}}>Upload any invoice or document — Claude AI will extract and fill in all fields automatically.</div>
      </div>
      <input ref={pdfRef} type="file" accept=".pdf" style={{display:'none'}} onChange={e=>{if(e.target.files[0])importFromPDF(e.target.files[0]);e.target.value=''}}/>
      <PBtn onClick={()=>pdfRef.current?.click()} col={aiLoading?'#999':'#1b5e20'} style={{whiteSpace:'nowrap'}}>{aiLoading?'⏳ AI Processing…':'📎 Import from PDF'}</PBtn>
    </div>
    <div style={sec}><div style={stl}>📄 Document Type &amp; Dates</div>
      <FR>
        <F label="Type" third><select value={form.type} onChange={e=>f('type',e.target.value)} style={IS}><option value="estimate">Estimate</option><option value="invoice">Tax Invoice</option><option value="final-invoice">Final Invoice</option></select></F>
        <F label="Tax Type" third><select value={form.gstType||'cgst_sgst'} onChange={e=>f('gstType',e.target.value)} style={IS}><option value="cgst_sgst">CGST + SGST (Intra-state)</option><option value="igst">IGST (Inter-state)</option></select></F>
        <F label="Date" third><In type="date" value={form.date} onChange={e=>f('date',e.target.value)}/></F>
        <F label="Due Date" third><In type="date" value={form.dueDate||''} onChange={e=>f('dueDate',e.target.value)}/></F>
        <F label="Linked Job Card # (optional)" third><In value={form.jobCardId||''} onChange={e=>f('jobCardId',e.target.value)} placeholder="e.g. 1001"/></F>
      </FR>
    </div>
    <div style={sec}><div style={stl}>👤 Customer Details</div>
      <FR>
        <F label="Quick-select Customer"><Sl value={form.customerId||''} onChange={e=>pickC(e.target.value)} opts={data.customers.map(c=>({v:c.id,l:`${c.name} — ${c.phone}`}))}/></F>
        <F label="Customer Name *" half><In value={form.customerName} onChange={e=>f('customerName',e.target.value)} placeholder="Contact person name"/></F>
        <F label="Company Name" half><In value={form.companyName||''} onChange={e=>f('companyName',e.target.value)} placeholder="Fleet / company (if applicable)"/></F>
        <F label="Phone" half><In value={form.customerPhone||''} onChange={e=>f('customerPhone',e.target.value)}/></F>
        <F label="Email" half><In type="email" value={form.customerEmail||''} onChange={e=>f('customerEmail',e.target.value)}/></F>
        <F label="GSTIN (Corporate)"><In value={form.customerGstin||''} onChange={e=>f('customerGstin',e.target.value)} placeholder="15-digit GSTIN"/></F>
        <F label="Address"><Tx value={form.customerAddress||''} onChange={e=>f('customerAddress',e.target.value)} style={{minHeight:52}}/></F>
      </FR>
    </div>
    <div style={sec}><div style={stl}>🚗 Vehicle Details</div>
      <FR>
        <F label="Quick-select Vehicle"><Sl value={form.vehicleId||''} onChange={e=>pickV(e.target.value)} opts={(custVehs.length>0?custVehs:data.vehicles).map(v=>({v:v.id,l:`${v.regNo} — ${v.make} ${v.model}`}))}/></F>
        <F label="Reg No." third><In value={form.vehicleReg||''} onChange={e=>f('vehicleReg',e.target.value.toUpperCase())} placeholder="HR98H1599"/></F>
        <F label="Make / Model / Year" third><In value={form.vehicleDetails||''} onChange={e=>f('vehicleDetails',e.target.value)} placeholder="Mahindra Bolero BS6"/></F>
        <F label="Odometer (km)" third><In type="number" value={form.odometer||''} onChange={e=>f('odometer',e.target.value)}/></F>
        <F label="VIN / Chassis No." third><In value={form.vinNo||''} onChange={e=>f('vinNo',e.target.value)} placeholder="MA1NA2XZXN6J94001"/></F>
        <F label="Engine No." third><In value={form.engineNo||''} onChange={e=>f('engineNo',e.target.value)} placeholder="XZN6J71659"/></F>
        <F label="Color" third><In value={form.vehicleColor||''} onChange={e=>f('vehicleColor',e.target.value)} placeholder="WHITE"/></F>
        <F label="Fuel Type" third><In value={form.vehicleFuel||''} onChange={e=>f('vehicleFuel',e.target.value)} placeholder="DIESEL"/></F>
      </FR>
    </div>
    <div style={{...sec,background:'#fff'}}><div style={stl}>📋 Parts &amp; Labour Items</div>
      <LineEd items={items} setItems={setItems} parts={data.parts} gstType={form.gstType}/>
    </div>
    <div style={sec}><div style={stl}>💰 Adjustments &amp; Totals</div>
      <FR>
        <F label="Additional Discount (₹)" third><In type="number" value={form.additionalDiscount||0} onChange={e=>f('additionalDiscount',+e.target.value)} min={0}/></F>
        <F label="Adjustment ± (₹)" third><In type="number" value={form.adjustment||0} onChange={e=>f('adjustment',+e.target.value)}/></F>
        <F label="Final Grand Total (preview)" third><div style={{padding:'8px 10px',background:'#e3f2fd',borderRadius:6,fontWeight:900,fontSize:15,color:'#1565c0'}}>{fmt(finalTotal)}</div></F>
      </FR>
    </div>
    <div style={sec}><div style={stl}>💳 Payment</div>
      <FR>
        <F label="Payment Status" third><select value={form.paymentStatus} onChange={e=>f('paymentStatus',e.target.value)} style={IS}><option value="pending">Pending</option><option value="partial">Partial</option><option value="paid">Paid</option></select></F>
        <F label="Payment Method" third><Sl value={form.paymentMethod||''} onChange={e=>f('paymentMethod',e.target.value)} opts={['Cash','UPI','Credit Card','Debit Card','Bank Transfer','Cheque','Insurance']}/></F>
        <F label="Amount Paid (₹)" third><In type="number" value={form.amountPaid||0} onChange={e=>f('amountPaid',+e.target.value)} min={0}/></F>
      </FR>
    </div>
    <div style={sec}><div style={stl}>📝 Notes &amp; Terms</div>
      <FR>
        <F label="Notes / Special Instructions"><Tx value={form.notes||''} onChange={e=>f('notes',e.target.value)} placeholder="Any special notes for this invoice…"/></F>
        <F label="Terms &amp; Conditions (override; blank = use default from Settings)"><Tx value={form.termsConditions||''} onChange={e=>f('termsConditions',e.target.value)} style={{minHeight:72}}/></F>
      </FR>
    </div>
    <Btns onCancel={onClose} onSave={doSave} label={initial?.id?'Save Changes':'Create Invoice'}/>
  </div>
}

/* ─── DASHBOARD ─────────────────────────────────────── */
function Dashboard({data,setTab}){
  const m=new Date().toISOString().slice(0,7)
  const openJ=data.jobCards.filter(j=>['open','in-progress'].includes(j.status)).length
  const mRev=data.invoices.filter(i=>i.date?.startsWith&&i.date.startsWith(m)).reduce((s,i)=>s+(+i.grand||0),0)
  const pDue=data.invoices.filter(i=>i.paymentStatus!=='paid').reduce((s,i)=>s+(+i.grand||0),0)
  const lowS=data.parts.filter(p=>(+p.qty||0)<=(+p.minQty||2)).length
  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <h2 style={{fontSize:19,fontWeight:800,margin:0}}>Dashboard</h2>
      <span style={{fontSize:11,color:'#6b7280'}}>{new Date().toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</span>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(145px,1fr))',gap:12,marginBottom:20}}>
      <SC label="Open Jobs" val={openJ} em="🔧" col="#1565c0"/>
      <SC label="Month Revenue" val={fmt(mRev)} em="💰" col="#6a1b9a"/>
      <SC label="Pending Dues" val={fmt(pDue)} em="⏳" col="#e65100"/>
      <SC label="Customers" val={data.customers.length} em="👥" col="#01579b"/>
      <SC label="Vehicles" val={data.vehicles.length} em="🚗" col="#004d40"/>
      <SC label="Parts" val={data.parts.length} em="📦" col="#4e342e"/>
      <SC label="Low Stock" val={lowS} em="⚠️" col={lowS>0?"#c62828":"#2e7d32"}/>
      <SC label="Total Jobs" val={data.jobCards.length} em="📋" col="#37474f"/>
    </div>
    {lowS>0&&<div style={{background:'#fff3e0',border:'1px solid #ffb74d',borderRadius:8,padding:'10px 16px',marginBottom:16,fontSize:12,color:'#e65100'}}>⚠ <b>{lowS} part{lowS>1?'s':''}</b> at or below minimum stock. <button onClick={()=>setTab('Inventory')} style={{color:'#e65100',background:'none',border:'none',cursor:'pointer',textDecoration:'underline',fontSize:12}}>View →</button></div>}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
      <div style={{background:'#fff',border:'1px solid #e8ecf0',borderRadius:10,padding:16}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:12}}><b style={{fontSize:14}}>Recent Job Cards</b><button onClick={()=>setTab('Job Cards')} style={{fontSize:12,color:'#1565c0',background:'none',border:'none',cursor:'pointer'}}>View all →</button></div>
        {data.jobCards.length===0?<p style={{color:'#aaa',textAlign:'center',padding:20,fontSize:12}}>No job cards yet.</p>:<table style={{fontSize:12}}><thead><tr>{['Job #','Customer','Vehicle','Status','Amount'].map(h=><th key={h} style={TH}>{h}</th>)}</tr></thead><tbody>{data.jobCards.slice(0,8).map(j=><tr key={j.id}><td style={{...TD,color:'#1565c0',fontWeight:800}}>JC-{j.id}</td><td style={TD}>{j.customerName}</td><td style={{...TD,fontWeight:700}}>{j.vehicleReg}</td><td style={TD}><Bdg s={j.status}/></td><td style={{...TD,fontWeight:700}}>{fmt(j.grand)}</td></tr>)}</tbody></table>}
      </div>
      <div style={{background:'#fff',border:'1px solid #e8ecf0',borderRadius:10,padding:16}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:12}}><b style={{fontSize:14}}>Recent Invoices</b><button onClick={()=>setTab('Invoices')} style={{fontSize:12,color:'#1565c0',background:'none',border:'none',cursor:'pointer'}}>View all →</button></div>
        {data.invoices.length===0?<p style={{color:'#aaa',textAlign:'center',padding:20,fontSize:12}}>No invoices yet.</p>:<table style={{fontSize:12}}><thead><tr>{['#','Customer','Amount','Status'].map(h=><th key={h} style={TH}>{h}</th>)}</tr></thead><tbody>{data.invoices.slice(0,5).map(i=><tr key={i.id}><td style={{...TD,color:'#1565c0',fontWeight:800}}>{i.type==='estimate'?'EST':i.type==='final-invoice'?'FINV':'INV'}-{i.id}</td><td style={TD}>{i.customerName}</td><td style={{...TD,fontWeight:700}}>{fmt(i.grand)}</td><td style={TD}><Bdg s={i.paymentStatus||'pending'}/></td></tr>)}</tbody></table>}
      </div>
    </div>
  </div>
}

/* ─── CUSTOMERS ─────────────────────────────────────── */
function Customers({data,db}){
  const[show,setShow]=useState(false);const[ed,setEd]=useState(null);const[q,setQ]=useState('')
  const blank={name:'',companyName:'',phone:'',email:'',address:'',gstin:'',type:'individual',notes:''}
  const[form,setForm]=useState(blank);const f=(k,v)=>setForm(p=>({...p,[k]:v}))
  function open(c){setEd(c||null);setForm(c?{...c}:blank);setShow(true)}
  async function doSave(){if(!form.name||!form.phone){alert('Name and phone required.');return}await db.saveCustomer(form);setShow(false)}
  const list=data.customers.filter(c=>!q||c.name?.toLowerCase().includes(q.toLowerCase())||c.phone?.includes(q))
  return <div>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
      <h2 style={{fontSize:19,fontWeight:800,margin:0,flex:1}}>Customers</h2>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search name / phone…" style={{...IS,width:200}}/>
      <PBtn onClick={()=>open(null)}>+ Add Customer</PBtn>
    </div>
    <table><thead><tr>{['ID','Name','Phone','Email','Type','GSTIN','Actions'].map(h=><th key={h} style={TH}>{h}</th>)}</tr></thead>
    <tbody>{list.map(c=><tr key={c.id}>
      <td style={{...TD,color:'#1565c0',fontWeight:800}}>C-{c.id}</td>

      <td style={TD}>{c.phone}</td><td style={{...TD,color:'#6b7280'}}>{c.email||'—'}</td>
      <td style={TD}><Bdg s={c.type||'individual'}/></td>
      <td style={{...TD,fontFamily:'monospace',fontSize:10}}>{c.gstin||'—'}</td>
      <td style={TD}>

      </td>
    </tr>)}</tbody></table>
    {list.length===0&&<p style={{textAlign:'center',color:'#aaa',padding:36}}>No customers yet.</p>}
    {show&&<Modal title={ed?'Edit Customer':'Add Customer'} onClose={()=>setShow(false)}>
      <FR>
        <F label="Full Name *" half><In value={form.name} onChange={e=>f('name',e.target.value)}/></F>

function Inventory({data,db}){
  const[show,setShow]=useState(false);const[ed,setEd]=useState(null);const[q,setQ]=useState('');const[cat,setCat]=useState('');const[usage,setUsage]=useState(null)
  const[aiLoading,setAiLoading]=useState(false);const pdfRef=useRef(null)
  const blank={name:'',partNo:'',hsnCode:'',gst:18,purchasePrice:'',sellingPrice:'',qty:0,minQty:2,unit:'nos',category:'spare',rack:'',vehicleMake:'',vehicleModel:'',notes:''}
  const[form,setForm]=useState(blank);const f=(k,v)=>setForm(p=>({...p,[k]:v}))
  async function importFromPDF(file){
    setAiLoading(true)
    try{
      const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file)})
      const{data:resp,error}=await sb.functions.invoke('anthropic-proxy',{
        body:{
          model:'claude-haiku-4-5-20251001',max_tokens:2000,
          messages:[{role:'user',content:[
            {type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},
            {type:'text',text:`Extract all line items from this purchase/inventory invoice. Return ONLY a JSON array, no explanation:\n[{"name":"","partNo":"","hsnCode":"","gst":18,"qty":1,"unit":"nos","category":"spare","vehicleMake":"","vehicleModel":"","sellingPrice":0,"purchasePrice":0}]\nRules:\n- sellingPrice = taxable value PER UNIT (before GST). If total taxable for a line is given, divide by qty.\n- purchasePrice = total amount PER UNIT (taxable + GST). If total is given, divide by qty.\n- vehicleMake = car brand this part fits (e.g. "Maruti Suzuki", "Hyundai"), empty string if universal\n- vehicleModel = car model this part fits (e.g. "Swift", "i20"), empty string if universal or multi-model\n- category must be one of: spare,consumable,accessory,lubricant,tyre,electrical,body,other\n- unit must be one of: nos,litre,set,pair,kg,ml,mtr,box`}
          ]}]
        }
      })
      if(error) throw new Error(error.message||'Edge Function not set up. See Settings → AI Setup.')
      if(!resp?.content?.length) throw new Error(resp?.error?.message||'Unexpected AI response — check Edge Function includes anthropic-beta: pdfs-2024-09-25 header.')
      const text=resp.content[0].text
      const json=JSON.parse(text.match(/\[[\s\S]*\]/)[0])
      const n0=v=>v===''||v==null?0:+v
      let created=0,updated=0
      for(const it of json){
        if(!it.name?.trim()) continue
        const existing=data.parts.find(p=>p.name.toLowerCase().trim()===it.name.toLowerCase().trim())
        if(existing){
          await db.savePart({...existing,qty:(+existing.qty||0)+(n0(it.qty)||1),sellingPrice:n0(it.sellingPrice)||+existing.sellingPrice||0,purchasePrice:n0(it.purchasePrice)||+existing.purchasePrice||0,partNo:it.partNo||existing.partNo||'',hsnCode:it.hsnCode||existing.hsnCode||'',gst:n0(it.gst)||+existing.gst||18,vehicleMake:it.vehicleMake||existing.vehicleMake||'',vehicleModel:it.vehicleModel||existing.vehicleModel||''})
          updated++
        }else{
          await db.savePart({name:it.name.trim(),partNo:it.partNo||'',hsnCode:it.hsnCode||'',gst:n0(it.gst)||18,qty:n0(it.qty)||0,minQty:2,unit:it.unit||'nos',category:it.category||'spare',rack:'',vehicleMake:it.vehicleMake||'',vehicleModel:it.vehicleModel||'',notes:'',sellingPrice:n0(it.sellingPrice),purchasePrice:n0(it.purchasePrice)})
          created++
        }
      }
      alert(`✓ AI imported ${json.length} item(s):\n• ${created} new part(s) added\n• ${updated} existing part(s) updated (qty added)`)
    }catch(e){alert('AI import failed: '+e.message)}
    setAiLoading(false)
  }
  function open(p){setEd(p||null);setForm(p?{...p}:blank);setShow(true)}
  function autoHSN(){
    const n=form.name.toLowerCase()
    let m=Object.entries(HSN).find(([k])=>k.toLowerCase()===n)
    if(!m)m=Object.entries(HSN).find(([k])=>n.includes(k.toLowerCase())||k.toLowerCase().includes(n))
    if(m){setForm(p=>({...p,hsnCode:m[1].h,gst:m[1].g}));alert(`✓ Found!\nHSN: ${m[1].h}  |  GST: ${m[1].g}%`)}
    else alert('Not in HSN database.\n\nCommon codes:\n• Brakes/Suspension: 87083000 @ 28%\n• Filters: 84212300 @ 18%\n• Battery: 85072000 @ 28%\n• Engine parts: 84099200 @ 28%\n• Tyres: 40111000 @ 28%\n• Engine Oil/Fluids: 27101980 @ 18%')
  }
  async function doSave(){
    if(!form.name){alert('Part name is required.');return}
    const n0=v=>v===''||v==null?0:+v
    await db.savePart({...form,sellingPrice:n0(form.sellingPrice),purchasePrice:n0(form.purchasePrice),gst:n0(form.gst)||18,qty:n0(form.qty),minQty:n0(form.minQty)||2})
    setShow(false)

  const list=data.parts.filter(p=>(!q||p.name?.toLowerCase().includes(q.toLowerCase())||p.partNo?.includes(q))&&(!cat||p.category===cat))
  const low=data.parts.filter(p=>(+p.qty||0)<=(+p.minQty||2)).length
  return <div>

      </select>
      <input ref={pdfRef} type="file" accept=".pdf" style={{display:'none'}} onChange={e=>{if(e.target.files[0])importFromPDF(e.target.files[0]);e.target.value=''}}/>
      <PBtn onClick={()=>pdfRef.current?.click()} col={aiLoading?'#999':'#1b5e20'} style={{whiteSpace:'nowrap'}}>{aiLoading?'⏳ AI Processing…':'📎 Import from PDF'}</PBtn>
      <PBtn onClick={()=>open(null)}>+ Add Part</PBtn>
    </div>
    {low>0&&<div style={{background:'#fff3e0',border:'1px solid #ffb74d',borderRadius:8,padding:'9px 16px',marginBottom:14,fontSize:12,color:'#e65100'}}>⚠ <b>{low} part{low>1?'s':''}</b> at or below minimum stock level.</div>}
    <div style={{overflowX:'auto'}}>
      <table style={{minWidth:960}}><thead><tr>{['Part Name','Part No.','Make / Model','Category','HSN Code','GST','Sell Price','Buy Price','Stock','Min','Actions'].map(h=><th key={h} style={TH}>{h}</th>)}</tr></thead>
      <tbody>{list.map(p=><tr key={p.id} style={{background:(+p.qty||0)<=(+p.minQty||2)?'#fff8e1':'#fff'}}>
        <td style={{...TD,fontWeight:700}}>{p.name}</td>
        <td style={{...TD,fontFamily:'monospace',fontSize:10,color:'#888'}}>{p.partNo||'—'}</td>
        <td style={{...TD,fontSize:11,color:'#555'}}>{[p.vehicleMake,p.vehicleModel].filter(Boolean).join(' ')||'—'}</td>
        <td style={TD}><Bdg s={p.category||'spare'}/></td>
        <td style={{...TD,fontFamily:'monospace',fontSize:10}}>{p.hsnCode}</td>
        <td style={TD}>{p.gst}%</td>
        <td style={{...TD,fontWeight:800,color:'#1565c0'}}>{fmt(p.sellingPrice)}</td>
        <td style={{...TD,color:'#888'}}>{fmt(p.purchasePrice)}</td>
        <td style={{...TD,fontWeight:900,color:(+p.qty||0)<=(+p.minQty||2)?'#c62828':'#2e7d32'}}>{p.qty||0} {p.unit}</td>
        <td style={{...TD,color:'#aaa'}}>{p.minQty||2}</td>
        <td style={TD}>
          <button onClick={()=>setUsage(p)} style={{marginRight:4,padding:'3px 9px',border:'1px solid #c5cae9',borderRadius:5,cursor:'pointer',fontSize:11,color:'#3949ab'}}>📊</button>
          <button onClick={()=>open(p)} style={{marginRight:4,padding:'3px 9px',border:'1px solid #d0d7de',borderRadius:5,cursor:'pointer',fontSize:11}}>✏</button>
          <button onClick={async()=>{if(confirm('Delete?'))await db.delPart(p.id)}} style={{padding:'3px 9px',border:'1px solid #ffcdd2',borderRadius:5,cursor:'pointer',fontSize:11,color:'#c62828'}}>🗑</button>
        </td>
      </tr>)}</tbody></table>
    </div>
    {list.length===0&&<p style={{textAlign:'center',color:'#aaa',padding:36}}>No parts yet.</p>}
    {usage&&<Modal title={`Usage History — ${usage.name}`} onClose={()=>setUsage(null)}>
      {(()=>{
        const rows=(data.invoices||[]).flatMap(inv=>{
          const its=(inv.items||[]).filter(it=>!it.isService&&(it.partId===usage.id||it.name===usage.name))
          return its.map(it=>({invNo:buildInvNo(data.settings||{},inv),date:inv.date,customer:inv.customerName||'—',qty:+it.qty||0,rate:+it.rate||0}))

/* ─── INVOICES ──────────────────────────────────────── */
function Invoices({data,db}){
  const[sub,setSub]=useState('invoice');const[showNew,setShowNew]=useState(false);const[editI,setEditI]=useState(null);const[printI,setPrintI]=useState(null);const[q,setQ]=useState('')
  const TABS=[{k:'estimate',l:'Estimates'},{k:'invoice',l:'Invoices'},{k:'final-invoice',l:'Final Invoices'}]
  const pre=sub==='estimate'?'EST':sub==='final-invoice'?'FINV':'INV'
  const list=data.invoices.filter(i=>i.type===sub&&(!q||i.customerName?.toLowerCase().includes(q.toLowerCase())||i.vehicleReg?.toLowerCase().includes(q.toLowerCase())||String(i.id).includes(q)))

  const paid=list.filter(i=>i.paymentStatus==='paid').reduce((s,i)=>s+(+i.grand||0),0)

    </div>
    {list.length>0&&<div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap'}}>

        <td style={{...TD,color:'#1565c0',fontWeight:800}}>{buildInvNo(data.settings||DEF,inv)}</td>

        <td style={{...TD,fontWeight:700}}>{inv.vehicleReg||'—'}</td>

        <td style={{...TD,fontWeight:800}}>{fmt(inv.grand)}</td>
        <td style={TD}><select value={inv.paymentStatus||'pending'} onChange={e=>db.markPay(inv.id,e.target.value)} style={{padding:'4px 6px',border:'1px solid #d0d7de',borderRadius:5,fontSize:11,background:pbg,color:pfg,fontWeight:700,cursor:'pointer',width:'auto'}}><option value="pending">Pending</option><option value="partial">Partial</option><option value="paid">Paid</option></select></td>
        <td style={{...TD,color:'#6b7280',fontSize:11}}>{inv.paymentMethod||'—'}</td>
        <td style={TD}><div style={{display:'flex',gap:4}}>
          <button onClick={()=>setPrintI(inv)} style={{padding:'4px 10px',background:'#1565c0',color:'#fff',border:'none',borderRadius:5,cursor:'pointer',fontSize:11,fontWeight:700}}>🖨 Print</button>
          <button onClick={()=>setEditI(inv)} style={{padding:'3px 8px',border:'1px solid #d0d7de',borderRadius:5,cursor:'pointer',fontSize:11}}>✏</button>
          <button onClick={async()=>{if(confirm('Delete?'))await db.delInvoice(inv.id)}} style={{padding:'3px 8px',border:'1px solid #ffcdd2',borderRadius:5,cursor:'pointer',fontSize:11,color:'#c62828'}}>🗑</button>
        </div></td>
      </tr>
    })}</tbody></table>
    {list.length===0&&<p style={{textAlign:'center',color:'#aaa',padding:36}}>No {TABS.find(t=>t.k===sub)?.l.toLowerCase()} yet. <button onClick={()=>setShowNew(true)} style={{color:'#1565c0',background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>Create one →</button></p>}
    {showNew&&<Modal title="New Invoice / Estimate" onClose={()=>setShowNew(false)} wide><InvEditor data={data} onSave={async f=>{await db.saveInvoice(f);setShowNew(false)}} onClose={()=>setShowNew(false)}/></Modal>}
    {editI&&<Modal title={`Edit — ${buildInvNo(data.settings||DEF,editI)}`} onClose={()=>setEditI(null)} wide><InvEditor initial={editI} data={data} onSave={async f=>{await db.saveInvoice(f);setEditI(null)}} onClose={()=>setEditI(null)}/></Modal>}

serve(async (req) => {

  }
})`}</pre>

        <div style={{width:60,height:60,background:'linear-gradient(135deg,#1976d2,#1565c0)',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:22,fontWeight:900,margin:'0 auto 14px',boxShadow:'0 4px 16px rgba(21,101,192,.4)'}}>FA</div>
        <div style={{fontSize:20,fontWeight:900,color:'#1a1a2e'}}>Friends Automotive</div>
        <div style={{fontSize:12,color:'#888',marginTop:4}}>Admin Access Only</div>
      </div>
      <form onSubmit={doLogin}>
        <div style={{marginBottom:14}}>
          <label style={{fontSize:12,fontWeight:600,color:'#444',display:'block',marginBottom:5}}>Email</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required autoFocus style={{width:'100%',padding:'10px 12px',border:'1px solid #d0d7de',borderRadius:8,fontSize:13,outline:'none',boxSizing:'border-box'}} placeholder="admin@example.com"/>
        </div>
        <div style={{marginBottom:20}}>
          <label style={{fontSize:12,fontWeight:600,color:'#444',display:'block',marginBottom:5}}>Password</label>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} required style={{width:'100%',padding:'10px 12px',border:'1px solid #d0d7de',borderRadius:8,fontSize:13,outline:'none',boxSizing:'border-box'}} placeholder="••••••••"/>
        </div>
        {err&&<div style={{background:'#fce4ec',color:'#c62828',padding:'9px 12px',borderRadius:7,fontSize:12,marginBottom:16,lineHeight:1.5}}>{err}</div>}
        <button type="submit" disabled={loading} style={{width:'100%',padding:'12px',background:'#1565c0',color:'#fff',border:'none',borderRadius:8,fontSize:14,fontWeight:700,cursor:'pointer',opacity:loading?.7:1}}>
          {loading?'Signing in…':'Sign In'}
        </button>
      </form>
    </div>
  </div>
}

/* ─── APP SHELL ─────────────────────────────────────── */
const NAV=[{k:'Dashboard',e:'📊'},{k:'Job Cards',e:'🔧'},{k:'Invoices',e:'🧾'},{k:'Customers',e:'👥'},{k:'Vehicles',e:'🚗'},{k:'Inventory',e:'📦'},{k:'Settings',e:'⚙️'}]

function AppShell({onLogout}){
  const db=useDB()
  const{D,ready,busy,err,reload}=db
  const[tab,setTab]=useState('Dashboard')
  const[col,setCol]=useState(false)

  if(ready&&err)return <ErrScreen msg={err} onRetry={reload}/>
  if(!ready)return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:16,background:'#f0f4f8'}}>
    <div style={{width:44,height:44,border:'4px solid #dbeafe',borderTop:'4px solid #1565c0',borderRadius:'50%',animation:'spin .8s linear infinite'}}/>
    <div style={{fontSize:15,fontWeight:800,color:'#1565c0'}}>Friends Automotive</div>
    <div style={{fontSize:12,color:'#888'}}>Loading data…</div>
  </div>

  const data={...D}

  return <div style={{display:'flex',height:'100vh',overflow:'hidden',background:'#f0f4f8'}}>
    {/* SIDEBAR */}
    <div style={{width:col?54:198,background:'linear-gradient(175deg,#0d2137,#0f3460)',flexShrink:0,display:'flex',flexDirection:'column',transition:'width .2s',overflow:'hidden',boxShadow:'2px 0 12px rgba(0,0,0,.2)'}}>
      <div style={{padding:col?'14px 10px':'14px 16px',borderBottom:'1px solid rgba(255,255,255,.08)',display:'flex',alignItems:'center',gap:10,minHeight:58}}>
        <div style={{width:32,height:32,background:'linear-gradient(135deg,#1976d2,#1565c0)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:14,fontWeight:900,flexShrink:0,boxShadow:'0 2px 8px rgba(21,101,192,.4)'}}>FA</div>
        {!col&&<div style={{overflow:'hidden'}}>
          <div style={{color:'#fff',fontSize:13,fontWeight:800,whiteSpace:'nowrap'}}>Friends Automotive</div>
          <div style={{color:'rgba(255,255,255,.4)',fontSize:10,whiteSpace:'nowrap'}}>Garage Management</div>
        </div>}
      </div>
      <nav style={{flex:1,padding:'8px 0',overflowY:'auto'}}>
        {NAV.map(t=><button key={t.k} onClick={()=>setTab(t.k)} title={t.k} style={{width:'100%',textAlign:'left',padding:col?'10px 0':'10px 16px',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:10,background:tab===t.k?'rgba(25,118,210,.35)':'transparent',color:tab===t.k?'#90caf9':'rgba(255,255,255,.65)',fontWeight:tab===t.k?800:500,fontSize:12,justifyContent:col?'center':'flex-start',borderLeft:tab===t.k?'3px solid #42a5f5':'3px solid transparent',transition:'all .15s'}}><span style={{fontSize:17,flexShrink:0}}>{t.e}</span>{!col&&t.k}</button>)}
      </nav>
      {!col&&<div style={{padding:'10px 14px',borderTop:'1px solid rgba(255,255,255,.08)',fontSize:10,color:'rgba(255,255,255,.3)',lineHeight:1.8}}>
        <div>{data.customers.length} customers · {data.vehicles.length} vehicles</div>
        <div>{data.parts.length} parts · {data.jobCards.length} jobs</div>
        <div>{data.invoices.length} invoices{busy&&<span style={{color:'#90caf9'}}> · saving…</span>}</div>
      </div>}
      <button onClick={onLogout} title="Logout" style={{margin:col?'8px auto':'8px 10px',width:col?36:undefined,padding:col?'7px 0':'8px 14px',background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.12)',borderRadius:7,cursor:'pointer',color:'rgba(255,255,255,.6)',fontSize:11,display:'flex',alignItems:'center',gap:6,justifyContent:col?'center':'flex-start',flexShrink:0}}>
        <span style={{fontSize:15}}>🚪</span>{!col&&'Logout'}
      </button>
    </div>

    {/* MAIN */}
    <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
      <div style={{height:50,background:'#fff',borderBottom:'1px solid #e8ecf0',display:'flex',alignItems:'center',padding:'0 20px',gap:12,flexShrink:0,boxShadow:'0 1px 4px rgba(0,0,0,.06)'}}>
        <button onClick={()=>setCol(p=>!p)} style={{border:'none',background:'none',cursor:'pointer',color:'#888',fontSize:22,padding:'2px 4px',lineHeight:1}}>☰</button>
        <span style={{fontSize:16,fontWeight:800,flex:1}}>{tab}</span>
        {busy&&<span style={{fontSize:11,color:'#1565c0',fontWeight:600}}>⟳ Saving to database…</span>}
        <div style={{background:'#dbeafe',color:'#1e40af',fontSize:10,padding:'4px 12px',borderRadius:20,fontWeight:800,fontFamily:'monospace'}}>{data.settings?.gstin}</div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:20,background:'#f0f4f8'}}>
        {tab==='Dashboard'&&<Dashboard data={data} setTab={setTab}/>}
        {tab==='Job Cards'&&<JobCards data={data} db={db} setTab={setTab}/>}
        {tab==='Invoices'&&<Invoices data={data} db={db}/>}
        {tab==='Customers'&&<Customers data={data} db={db}/>}
        {tab==='Vehicles'&&<Vehicles data={data} db={db}/>}
        {tab==='Inventory'&&<Inventory data={data} db={db}/>}
        {tab==='Settings'&&<Settings data={data} db={db}/>}
      </div>
    </div>
  </div>
}

function App(){
  const[session,setSession]=useState(null)
  const[authChecked,setAuthChecked]=useState(false)
  const configured=!window.FA_SUPABASE_URL.includes('PASTE_')

  useEffect(()=>{
    if(!configured){setAuthChecked(true);return}
    sb.auth.getSession().then(({data:{session}})=>{setSession(session);setAuthChecked(true)})
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>setSession(s))
    return()=>subscription.unsubscribe()
  },[])

  if(!configured) return <SetupScreen/>
  if(!authChecked) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:16,background:'#f0f4f8'}}>
    <div style={{width:44,height:44,border:'4px solid #dbeafe',borderTop:'4px solid #1565c0',borderRadius:'50%',animation:'spin .8s linear infinite'}}/>
    <div style={{fontSize:12,color:'#888'}}>Checking authentication…</div>
  </div>
  if(!session) return <LoginScreen/>
  return <AppShell onLogout={()=>sb.auth.signOut()}/>
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App))
</script>
</body>
</html>
