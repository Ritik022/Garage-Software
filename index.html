function downloadCSV(filename, headers, rows){
  const esc=v=>{const s=String(v==null?'':v);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s}
  const lines=[headers.map(esc).join(','),...rows.map(r=>r.map(esc).join(','))]
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'})
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href)
}

function calcItems(items){
  let sub=0, gt=0
  const lines=(items||[]).map(it=>{
    const a=(+it.qty||0)*(+it.rate||0), disc=a*((+it.discount||0)/100), tax=a-disc, ga=tax*((+it.gst||0)/100)
    sub+=tax; gt+=ga; return{...it,a,disc,tax,ga,tot:tax+ga}
  })
  const cgst=gt/2, sgst=gt/2
  return {lines, sub, gt, cgst, sgst, grand:sub+gt}
}

function toWords(n){
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen']
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety']
  if(!n||n===0) return 'Zero'
  function w(x){
    if(x<20)return a[x]; if(x<100)return b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'')
    if(x<1000)return a[Math.floor(x/100)]+' Hundred'+(x%100?' '+w(x%100):'')
    if(x<100000)return w(Math.floor(x/1000))+' Thousand'+(x%1000?' '+w(x%1000):'')
    if(x<10000000)return w(Math.floor(x/100000))+' Lakh'+(x%100000?' '+w(x%100000):'')
    return w(Math.floor(x/10000000))+' Crore'+(x%10000000?' '+w(x%10000000):'')
  }
  const r=Math.floor(n), p=Math.round((n-r)*100)
  return w(r)+' Rupee'+(r!==1?'s':'')+(p>0?' and '+w(p)+' Paise':'')+' Only'
}

function fyOf(date){
  const pts=(date||today()).split('-')
  const yr=parseInt(pts[0]),mo=parseInt(pts[1])
  const s=mo>=4?yr:yr-1
  return{start:s,str:`${s}-${String(s+1).slice(-2)}`}
}

        const{data:found}=await sb.from('vehicles').select('id').eq('reg_no',form.vehicleReg).limit(1)
        if(found?.length){
          vehId=found[0].id
          const vRow=toSnake({...(custId&&{customerId:custId}),regNo:form.vehicleReg,make:form.vehicleDetails||'',odometer:+form.odometer||0,vin:form.vinNo||'',engineNo:form.engineNo||'',color:form.vehicleColor||'',fuelType:form.vehicleFuel||''})
          const{data:ud}=await sb.from('vehicles').update(vRow).eq('id',vehId).select().single()
          if(ud){const uv=toCamel(ud);setD(p=>({...p,vehicles:p.vehicles.map(v=>v.id===vehId?uv:v)}))}
        }else if(custId){
          const vRow=toSnake({customerId:custId,regNo:form.vehicleReg,make:form.vehicleDetails||'',odometer:+form.odometer||0,vin:form.vinNo||'',engineNo:form.engineNo||'',color:form.vehicleColor||'',fuelType:form.vehicleFuel||''})
          delete vRow.id
          const{data:vd,error:ve}=await sb.from('vehicles').insert(vRow).select().single(); if(ve)throw ve
          const nv=toCamel(vd); setD(p=>({...p,vehicles:[nv,...p.vehicles]})); vehId=nv.id
        }
      }
      row.customer_id=custId; row.vehicle_id=vehId
      let serial=null
      if(form.jobCardId){
        const{data:linked}=await sb.from('invoices').select('inv_serial').eq('job_card_id',+form.jobCardId).not('inv_serial','is',null).limit(1)
        if(linked&&linked.length>0) serial=linked[0].inv_serial
      }
      if(!serial){
        const fy=fyOf(form.date)
        const fyStartD=`${fy.start}-04-01`, fyEndD=`${fy.start+1}-03-31`
        const{data:ex}=await sb.from('invoices').select('inv_serial').gte('date',fyStartD).lte('date',fyEndD).not('inv_serial','is',null)
        const used=new Set((ex||[]).map(i=>i.inv_serial))
        serial=1; while(used.has(serial))serial++
      }
      row.inv_serial=serial
      delete row.id; const{data:d,error:e}=await sb.from('invoices').insert(row).select().single(); if(e)throw e
      const r=toCamel(d); setD(p=>({...p,invoices:[r,...p.invoices]})); await adjParts([],form.items||[]); return r
    }
  }),[])
  const markPay=useCallback(async(id,ps)=>op(async()=>{
    const{data:d,error:e}=await sb.from('invoices').update({payment_status:ps}).eq('id',id).select().single(); if(e)throw e
    const r=toCamel(d); setD(p=>({...p,invoices:p.invoices.map(i=>i.id===id?r:i)}))
  }),[])
  const cancelInvoice=useCallback(async id=>op(async()=>{
    const{data:d,error:e}=await sb.from('invoices').update({payment_status:'cancelled'}).eq('id',id).select().single(); if(e)throw e
    const r=toCamel(d); setD(p=>({...p,invoices:p.invoices.map(i=>i.id===id?r:i)}))
  }),[])

  // ── Settings
  const saveSettings=useCallback(async form=>op(async()=>{
    const row=toSnake(form); row.id=1
    const{data:d,error:e}=await sb.from('settings').upsert(row).select().single(); if(e)throw e
    const r=toCamel(d); setD(p=>({...p,settings:r})); return r
  }),[])

  return{D,ready,busy,err,reload:load,saveCustomer,delCustomer,saveVehicle,delVehicle,savePart,delPart,saveJob,delJob,saveInvoice,markPay,cancelInvoice,saveSettings}
}

/* ─── NUMERIC INPUT (no stuck-zero, free typing) ───── */
function NumInput({value,onChange,min,max,style:s,...rest}){
  const[v,setV]=useState('')
  const[focused,setFocused]=useState(false)
  return <input {...rest} type="text" inputMode="decimal"
    value={focused?v:String(value??0)}
    onChange={e=>setV(e.target.value)}
    onFocus={()=>{setV(+value===0?'':String(value??''));setFocused(true)}}
    onBlur={()=>{
      setFocused(false)
      let n=parseFloat(v)
      if(isNaN(n))n=0
      if(min!=null)n=Math.max(+min,n)
      if(max!=null)n=Math.min(+max,n)
      onChange({target:{value:n}})
    }}
    style={s}
  />
}
/* ─── TOTAL CELL (reverse-calc only on blur) ────────── */
function TotCell({tot,id,updTot,ii,itd}){
  const[v,setV]=useState('')
  const[focused,setFocused]=useState(false)
  const display=focused?v:parseFloat((tot||0).toFixed(2)).toString()
  return <td style={itd}><input type="text" inputMode="decimal"
    value={display}
    onChange={e=>setV(e.target.value)}
    onFocus={()=>{setV(+tot===0?'':parseFloat((tot||0).toFixed(2)).toString());setFocused(true)}}
    onBlur={()=>{setFocused(false);const n=parseFloat(v);if(!isNaN(n)&&n>=0)updTot(id,n)}}
    style={{...ii,width:82,fontWeight:700,color:'#6875f5',textAlign:'right'}}
  /></td>
}

    if(x.id!==id)return x
    const f=(+x.qty||0)*(1-(+x.discount||0)/100)*(1+(+x.gst||0)/100)

    const p2=parts.find(p=>p.name===name)

            <datalist id={`dl${it.id}`}>{(it.isService?SERVICES.map(s=>({n:s.n})):[...parts.map(p=>({n:p.name})),...SERVICES]).map(p=><option key={p.n} value={p.n}/>)}</datalist>

          <div style={{lineHeight:1.9}}>
            <div><b>Make / Model:</b> {(()=>{let s=inv.vehicleDetails||'';[inv.vehicleColor,inv.vehicleFuel].forEach(v=>{if(v)s=s.replace(new RegExp('[,\\s]*'+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[,\\s]*','gi'),' ').trim()});return s||'—'})()}</div>
            <div><b>Odometer:</b> {inv.odometer||'—'} km</div>
            {inv.vehicleColor&&<div><b>Color:</b> {inv.vehicleColor}</div>}

            <b>Place of Supply:</b> Haryana (06)

    {/* ITEMS TABLE */}
    <table style={{width:'100%',borderCollapse:'collapse',border:'1px solid #333',borderTop:'none'}}>
      <thead><tr>
        {(isIGST?[['#',false],['Part Name',false],['Description',false],['HSN Code',false],['GST (%)',false],['Qty',false],['Disc %',false],['Unit Price (₹)',true],['Disc. Amt (₹)',true],[igstH,true],['Total Taxable (₹)',true]]:[['#',false],['Part Name',false],['Description',false],['HSN Code',false],['GST (%)',false],['Qty',false],['Disc %',false],['Unit Price (₹)',true],['Disc. Amt (₹)',true],[cgstH,true],[sgstH,true],['Total Taxable (₹)',true]]).map(([h,r])=><th key={h} style={{...hcell,textAlign:r?'right':'center',padding:'6px'}}>{h}</th>)}
      </tr></thead>
      <tbody>
        {lines.map((it,i)=><tr key={it.id} style={{background:i%2?'#f9f9f9':'#fff'}}>
          <td style={{...cell,textAlign:'center',width:22}}>{i+1}</td>
          <td style={{...cell,fontWeight:600}}>{it.name}</td>
          <td style={{...cell,textAlign:'center',color:'#111'}}>{it.isService?'Labour':'Part'}</td>
          <td style={{...cell,textAlign:'center'}}>{it.hsnSac}</td>
          <td style={{...cell,textAlign:'center'}}>{it.gst}%</td>

          {isIGST?<td style={{...cell,textAlign:'right'}}>₹{Number(it.ga).toFixed(2)}</td>:<React.Fragment><td style={{...cell,textAlign:'right'}}>₹{Number(it.ga/2).toFixed(2)}</td><td style={{...cell,textAlign:'right'}}>₹{Number(it.ga/2).toFixed(2)}</td></React.Fragment>}
          <td style={{...cell,textAlign:'right',fontWeight:700}}>₹{Number(it.tax).toFixed(2)}</td>
        </tr>)}
        {[...Array(emptyRows)].map((_,i)=><tr key={`e${i}`} style={{height:20}}>{[...Array(isIGST?11:12)].map((_,j)=><td key={j} style={cell}>&nbsp;</td>)}</tr>)}
      </tbody>
      <tfoot>
        <tr style={{background:'#0d1a30'}}>
          <td colSpan={4} style={{...hcell,textAlign:'right',background:'#1565c0'}}>TOTALS</td>
          <td style={fcell}></td>
          <td style={{...fcell,textAlign:'center',fontWeight:700}}>{totalQty}</td>
          <td style={fcell}></td>
          <td style={{...fcell,textAlign:'right',fontWeight:700}}>₹{totalPreDisc.toFixed(2)}</td>
          <td style={{...fcell,textAlign:'right',fontWeight:700}}>₹{itemDiscountTotal.toFixed(2)}</td>
          {isIGST?<td style={{...fcell,textAlign:'right',fontWeight:700}}>₹{gt.toFixed(2)}</td>:<React.Fragment><td style={{...fcell,textAlign:'right',fontWeight:700}}>₹{(gt/2).toFixed(2)}</td><td style={{...fcell,textAlign:'right',fontWeight:700}}>₹{(gt/2).toFixed(2)}</td></React.Fragment>}
          <td style={{...fcell,textAlign:'right',fontWeight:800}}>₹{sub.toFixed(2)}</td>
        </tr>
      </tfoot>
    </table>
    {/* AMOUNT IN WORDS + SUBTOTALS */}
    <table style={{width:'100%',borderCollapse:'collapse',border:'1px solid #333',borderTop:'none'}}>
      <tbody><tr>
        <td style={{...cell,width:'55%',borderRight:'1px solid #333'}}>
          <div style={{fontWeight:700,fontSize:11,marginBottom:5}}>Amount in Words:<br/><span style={{fontWeight:400,fontStyle:'italic'}}>{toWords(fg)}</span></div>
          <div style={{fontWeight:700,fontSize:11,marginTop:8}}>Bank Details</div>
        </td>
        <td style={cell}>
          {(isIGST?[['Item Discount:',itemDiscountTotal],['Subtotal (taxable):',sub],[igstH+':',gt],['Total Tax:',gt],['Extra Discount:',inv.additionalDiscount||0],['Adjustment:',inv.adjustment||0]]:[['Item Discount:',itemDiscountTotal],['Subtotal (taxable):',sub],[cgstH+':',gt/2],[sgstH+':',gt/2],['Total Tax:',gt],['Extra Discount:',inv.additionalDiscount||0],['Adjustment:',inv.adjustment||0]]).map(([l,v])=><div key={l} style={{display:'flex',justifyContent:'space-between',padding:'3px 0'}}><span>{l}</span><span style={{fontWeight:700}}>₹{Number(v).toFixed(2)}</span></div>)}
        </td>
      </tr></tbody>
    </table>
    {/* BANK + GRAND TOTAL */}
    <table style={{width:'100%',borderCollapse:'collapse',border:'1px solid #333',borderTop:'none'}}>
      <thead><tr>
        {['#','Bank Name','Account No','IFSC Code','Branch'].map(h=><th key={h} style={hcell}>{h}</th>)}
        <th style={{...hcell,textAlign:'right',fontSize:11}}>Grand Total: ₹{fg.toFixed(2)}</th>
      </tr></thead>
      <tbody><tr>
        <td style={{...cell,textAlign:'center'}}>1</td>
        <td style={cell}>{settings.bankName}</td>
        <td style={{...cell,textAlign:'center'}}>{settings.accountNo}</td>
        <td style={{...cell,textAlign:'center'}}>{settings.ifsc}</td>
        <td style={cell}>{settings.bankBranch||''}</td>
        <td style={cell}></td>
      </tr></tbody>
    </table>
    {/* SIGNATURES */}
    <table style={{width:'100%',borderCollapse:'collapse',border:'1px solid #333',borderTop:'none'}}>
      <tbody>
        <tr><td colSpan={3} style={{...cell,fontStyle:'italic',color:'#111',lineHeight:1.6}}>I certify that the work has been done to my satisfaction and that I have taken delivery of the vehicle in good condition, with all items / valuables and parts intact</td></tr>
        <tr>
          {['Customer / Authorized Signatory','Service Advisor Signature','Cashier / Authorized Signature'].map((s,i)=><td key={i} style={{...cell,textAlign:'center',height:60,borderRight:i<2?'1px solid #333':'none'}}><div style={{borderTop:'1px solid #333',marginTop:40,paddingTop:4}}>{s}</div></td>)}
        </tr>
      </tbody>
    </table>
    {/* TERMS */}
    {(inv.termsConditions||settings.invoiceTerms)&&<table style={{width:'100%',borderCollapse:'collapse',border:'1px solid #333',borderTop:'none'}}><tbody><tr><td style={cell}><b>Terms &amp; Conditions:</b><div style={{whiteSpace:'pre-wrap',marginTop:4,lineHeight:1.6,color:'#111'}}>{inv.termsConditions||settings.invoiceTerms}</div></td></tr></tbody></table>}
    {inv.notes&&<table style={{width:'100%',borderCollapse:'collapse',border:'1px solid #333',borderTop:'none'}}><tbody><tr><td style={cell}><b>Notes: </b>{inv.notes}</td></tr></tbody></table>}
    </div>
    <div className="np" style={{display:'flex',gap:8,justifyContent:'center',marginTop:16}}>
      <GBtn onClick={onClose}>Close</GBtn>
      <PBtn onClick={doPrint}>🖨 Print / Save PDF</PBtn>
    </div>
  </div>
}

/* ─── INVOICE EDITOR (all fields editable) ──────────── */
function InvEditor({initial,data,onSave,onClose,light}){
  const blank={type:'invoice',gstType:'cgst_sgst',date:today(),dueDate:'',jobCardId:'',customerId:'',vehicleId:'',customerName:'',companyName:'',customerPhone:'',customerAddress:'',customerGstin:'',customerEmail:'',vehicleReg:'',vehicleDetails:'',odometer:'',vinNo:'',engineNo:'',vehicleColor:'',vehicleFuel:'',items:[],notes:'',termsConditions:'',paymentStatus:'pending',paymentMethod:'',amountPaid:0,additionalDiscount:0,adjustment:0}
  const[form,setForm]=useState(initial?{...blank,...initial}:blank)
  const[items,setItems]=useState(initial?.items||[])
  const[aiLoading,setAiLoading]=useState(false)
  const[saving,setSaving]=useState(false)
  const pdfRef=useRef(null)
  const f=(k,v)=>setForm(p=>({...p,[k]:v}))
  const custVehs=data.vehicles.filter(v=>v.customerId==form.customerId)

  async function importFromPDF(file){
    setAiLoading(true)
    try{
      const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file)})
      const {data,error}=await sb.functions.invoke('anthropic-proxy',{
        body:{
          model:'claude-haiku-4-5-20251001',max_tokens:1500,
          messages:[{role:'user',content:[
            {type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},
            {type:'text',text:`Extract details from this invoice/document. Return ONLY a JSON object, no explanation:\n{"customerName":"","companyName":"","customerPhone":"","customerEmail":"","customerAddress":"","customerGstin":"","vehicleReg":"","vehicleDetails":"","vinNo":"","engineNo":"","vehicleColor":"","vehicleFuel":"petrol","odometer":null,"date":"YYYY-MM-DD","notes":"","items":[{"name":"","qty":1,"rate":0,"gst":18,"hsnSac":"","discount":0,"isService":false}]}\nUse null for missing numbers, empty string for missing text. isService=true for labour/service items. vehicleFuel must be one of: petrol, diesel, cng, electric, hybrid.`}
          ]}]
        }
      })
      if(error) throw new Error(error.message||'Edge Function not set up. See Settings → AI Setup.')
      if(!data?.content?.length) throw new Error(data?.error?.message||data?.error?.type||'Unexpected AI response — make sure your Edge Function includes the anthropic-beta: pdfs-2024-09-25 header (see Settings → AI Setup).')
      const text=data.content[0].text
      const json=JSON.parse(text.match(/\{[\s\S]*\}/)[0])
      const upd={};['customerName','companyName','customerPhone','customerEmail','customerAddress','customerGstin','vehicleReg','vehicleDetails','vinNo','engineNo','vehicleColor','vehicleFuel','notes'].forEach(k=>{if(json[k])upd[k]=json[k]})
      if(json.odometer) upd.odometer=json.odometer
      if(json.date&&json.date.match(/^\d{4}-\d{2}-\d{2}$/)) upd.date=json.date
      setForm(p=>({...p,...upd}))
      if(json.items?.length) setItems(json.items.map(it=>({id:Date.now()+Math.random(),name:it.name||'',qty:+it.qty||1,rate:+it.rate||0,gst:+it.gst||18,hsnSac:it.hsnSac||'',discount:+it.discount||0,isService:!!it.isService})))
      alert(`✓ AI extracted ${json.items?.length||0} item(s). Please review before saving.`)
    }catch(e){alert('AI import failed: '+e.message)}
    setAiLoading(false)
  }

  function pickC(id){
    const c=data.customers.find(x=>x.id==id); if(!c)return
    setForm(p=>({...p,customerId:id,customerName:c.name||p.customerName,companyName:c.companyName||'',customerPhone:c.phone||p.customerPhone,customerAddress:c.address||p.customerAddress,customerGstin:c.gstin||p.customerGstin,customerEmail:c.email||p.customerEmail}))
  }
  function pickV(id){
    const v=data.vehicles.find(x=>x.id==id); if(!v)return
    setForm(p=>({...p,vehicleId:id,vehicleReg:v.regNo||p.vehicleReg,vehicleDetails:`${v.make} ${v.model} ${v.variant||''} ${v.year||''}`.trim().replace(/\s+/g,' ')||p.vehicleDetails,odometer:v.odometer||p.odometer,vinNo:v.vin||p.vinNo,engineNo:v.engineNo||p.engineNo,vehicleColor:v.color||p.vehicleColor,vehicleFuel:v.fuelType||p.vehicleFuel}))
  }
  const{sub,gt,grand}=calcItems(items)
  const finalTotal=(grand-(form.additionalDiscount||0))+(form.adjustment||0)
  async function doSave(){
    if(saving) return
    if(!form.customerName){alert('Customer name is required.');return}
    setSaving(true)
    try{
      const{sub:s,gt:g,cgst:cg,sgst:sg,grand:gr}=calcItems(items)
      const fg=gr-(form.additionalDiscount||0)+(form.adjustment||0)
      const ni=v=>v===''||v==null?null:+v
      await onSave({...form,jobCardId:ni(form.jobCardId),customerId:ni(form.customerId),vehicleId:ni(form.vehicleId),odometer:ni(form.odometer),items,subtotal:s,gstTot:g,cgstTot:cg,sgstTot:sg,grand:fg})
    }catch(e){alert('Error saving invoice: '+e.message);setSaving(false)}
  }
  const sec={border:'1px solid #e2e6ed',borderRadius:10,padding:16,marginBottom:16,background:'#f8f9fb'}
  const stl={fontSize:12,fontWeight:700,color:'#374151',marginBottom:12,paddingBottom:8,borderBottom:'1px solid #e2e6ed'}
  return <div>
    <div style={{background:'#eef2ff',border:'1px solid #c7d2fe',borderRadius:10,padding:'11px 16px',marginBottom:16,display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
      <div style={{flex:1,minWidth:180}}>
        <div style={{fontWeight:700,fontSize:13,color:'#3730a3',marginBottom:2}}>🤖 AI Auto-Fill from PDF</div>
        <div style={{fontSize:12,color:'#6b7280'}}>Upload any invoice or document — Claude AI will extract and fill in all fields automatically.</div>
      </div>
      <input ref={pdfRef} type="file" accept=".pdf" style={{display:'none'}} onChange={e=>{if(e.target.files[0])importFromPDF(e.target.files[0]);e.target.value=''}}/>
      <PBtn onClick={()=>pdfRef.current?.click()} col={aiLoading?'#9ca3af':'#4f63d2'} style={{whiteSpace:'nowrap'}}>{aiLoading?'⏳ AI Processing…':'📎 Import from PDF'}</PBtn>
    </div>
    <div style={sec}><div style={stl}>📄 Document Type &amp; Dates</div>
      <FR>
        <F label="Type" third><select value={form.type} onChange={e=>f('type',e.target.value)} style={IS}><option value="estimate">Estimate</option><option value="invoice">Tax Invoice</option><option value="final-invoice">Final Invoice</option></select></F>
        <F label="Tax Type" third><select value={form.gstType||'cgst_sgst'} onChange={e=>f('gstType',e.target.value)} style={IS}><option value="cgst_sgst">CGST + SGST (Intra-state)</option><option value="igst">IGST (Inter-state)</option></select></F>
        <F label="Date" third><In type="date" value={form.date} onChange={e=>f('date',e.target.value)}/></F>
        <F label="Due Date" third><In type="date" value={form.dueDate||''} onChange={e=>f('dueDate',e.target.value)}/></F>
        <F label="Linked Job Card # (optional)" third><In value={form.jobCardId||''} onChange={e=>f('jobCardId',e.target.value)} placeholder="e.g. 1001"/></F>
      </FR>
    </div>
    <div style={sec}><div style={stl}>👤 Customer Details</div>
      <FR>
        <F label="Quick-select Customer"><Sl value={form.customerId||''} onChange={e=>pickC(e.target.value)} opts={data.customers.map(c=>({v:c.id,l:`${c.name} — ${c.phone}`}))}/></F>
        <F label="Customer Name *" half><In value={form.customerName} onChange={e=>f('customerName',e.target.value)} placeholder="Contact person name"/></F>
        <F label="Company Name" half><In value={form.companyName||''} onChange={e=>f('companyName',e.target.value)} placeholder="Fleet / company (if applicable)"/></F>
        <F label="Phone" half><In value={form.customerPhone||''} onChange={e=>f('customerPhone',e.target.value)}/></F>
        <F label="Email" half><In type="email" value={form.customerEmail||''} onChange={e=>f('customerEmail',e.target.value)}/></F>
        <F label="GSTIN (Corporate)"><In value={form.customerGstin||''} onChange={e=>f('customerGstin',e.target.value)} placeholder="15-digit GSTIN"/></F>
        <F label="Address"><Tx value={form.customerAddress||''} onChange={e=>f('customerAddress',e.target.value)} style={{minHeight:52}}/></F>
      </FR>
    </div>
    <div style={sec}><div style={stl}>🚗 Vehicle Details</div>
      <FR>
        <F label="Quick-select Vehicle"><Sl value={form.vehicleId||''} onChange={e=>pickV(e.target.value)} opts={(custVehs.length>0?custVehs:data.vehicles).map(v=>({v:v.id,l:`${v.regNo} — ${v.make} ${v.model}`}))}/></F>
        <F label="Reg No." third><In value={form.vehicleReg||''} onChange={e=>f('vehicleReg',e.target.value.toUpperCase())} placeholder="HR98H1599"/></F>
        <F label="Make / Model / Year" third><In value={form.vehicleDetails||''} onChange={e=>f('vehicleDetails',e.target.value)} placeholder="Mahindra Bolero BS6"/></F>
        <F label="Odometer (km)" third><In type="number" value={form.odometer||''} onChange={e=>f('odometer',e.target.value)}/></F>
        <F label="VIN / Chassis No." third><In value={form.vinNo||''} onChange={e=>f('vinNo',e.target.value)} placeholder="MA1NA2XZXN6J94001"/></F>
        <F label="Engine No." third><In value={form.engineNo||''} onChange={e=>f('engineNo',e.target.value)} placeholder="XZN6J71659"/></F>
        <F label="Color" third><In value={form.vehicleColor||''} onChange={e=>f('vehicleColor',e.target.value)} placeholder="WHITE"/></F>
        <F label="Fuel Type" third><In value={form.vehicleFuel||''} onChange={e=>f('vehicleFuel',e.target.value)} placeholder="DIESEL"/></F>
      </FR>
    </div>
    <div style={sec}><div style={stl}>📋 Parts &amp; Labour Items</div>
      <LineEd items={items} setItems={setItems} parts={data.parts} gstType={form.gstType} light={light}/>
    </div>
    <div style={sec}><div style={stl}>💰 Adjustments &amp; Totals</div>
      <FR>
        <F label="Additional Discount (₹)" third><In type="number" value={form.additionalDiscount||0} onChange={e=>f('additionalDiscount',+e.target.value)} min={0}/></F>
        <F label="Adjustment ± (₹)" third><In type="number" value={form.adjustment||0} onChange={e=>f('adjustment',+e.target.value)}/></F>
        <F label="Final Grand Total (preview)" third><div style={{padding:'8px 11px',background:light?'#f0f4ff':'#162040',border:light?'1px solid #c7d2fe':'none',borderRadius:8,fontWeight:700,fontSize:15,color:light?'#3730a3':'#6875f5'}}>{fmt(finalTotal)}</div></F>
      </FR>
    </div>
    <div style={sec}><div style={stl}>💳 Payment</div>
      <FR>
        <F label="Payment Status" third><select value={form.paymentStatus} onChange={e=>f('paymentStatus',e.target.value)} style={IS}><option value="pending">Pending</option><option value="partial">Partial</option><option value="paid">Paid</option></select></F>
        <F label="Payment Method" third><Sl value={form.paymentMethod||''} onChange={e=>f('paymentMethod',e.target.value)} opts={['Cash','UPI','Credit Card','Debit Card','Bank Transfer','Cheque','Insurance']}/></F>
        <F label="Amount Paid (₹)" third><In type="number" value={form.amountPaid||0} onChange={e=>f('amountPaid',+e.target.value)} min={0}/></F>
      </FR>
    </div>
    <div style={sec}><div style={stl}>📝 Notes &amp; Terms</div>
      <FR>
        <F label="Notes / Special Instructions"><Tx value={form.notes||''} onChange={e=>f('notes',e.target.value)} placeholder="Any special notes for this invoice…"/></F>
        <F label="Terms &amp; Conditions (override; blank = use default from Settings)"><Tx value={form.termsConditions||''} onChange={e=>f('termsConditions',e.target.value)} style={{minHeight:72}}/></F>
      </FR>
    </div>
    {saving&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.42)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(4px)'}}>
      <div style={{background:'#1a1d27',borderRadius:14,padding:'28px 40px',textAlign:'center',boxShadow:'0 0 0 1px #1e2235,0 20px 48px -12px rgba(16,24,40,.28)'}}>
        <div style={{width:44,height:44,border:'4px solid #1e2235',borderTop:'4px solid #4f63d2',borderRadius:'50%',animation:'spin .8s linear infinite',margin:'0 auto 14px'}}/>
        <div style={{fontSize:14,fontWeight:700,color:'#e8eaf2',marginBottom:4}}>{initial?.id?'Updating Invoice…':'Creating Invoice…'}</div>
        <div style={{fontSize:12,color:'#818aa0'}}>Please wait, do not close this window</div>
      </div>
    </div>}
    <Btns onCancel={onClose} onSave={doSave} label={initial?.id?'Save Changes':'Create Invoice'} saving={saving}/>
  </div>
}

/* ─── DASHBOARD ─────────────────────────────────────── */
function Dashboard({data,setTab}){
  const now=new Date()
  const m=now.toISOString().slice(0,7)
  const todayStr=now.toISOString().slice(0,10)

  const active=data.invoices.filter(i=>i.paymentStatus!=='cancelled')
  const openJ=data.jobCards.filter(j=>['open','in-progress'].includes(j.status)).length
  const mRev=data.invoices.filter(i=>i.date?.startsWith(m)&&i.paymentStatus!=='cancelled').reduce((s,i)=>s+(+i.grand||0),0)
  const mCollected=data.invoices.filter(i=>i.date?.startsWith(m)&&i.paymentStatus==='paid').reduce((s,i)=>s+(+i.grand||0),0)
    +data.invoices.filter(i=>i.date?.startsWith(m)&&i.paymentStatus==='partial').reduce((s,i)=>s+(+i.amountPaid||0),0)
  const pendingDue=active.filter(i=>i.paymentStatus!=='paid').reduce((s,i)=>s+(+i.grand||0),0)
  const overdueInvs=data.invoices.filter(i=>i.paymentStatus==='pending'&&i.dueDate&&i.dueDate<todayStr)
  const lowS=data.parts.filter(p=>(+p.qty||0)<=(+p.minQty||2)).length

  const months=[]
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1)
    const key=d.toISOString().slice(0,7)
    const label=d.toLocaleDateString('en-IN',{month:'short'})
    const rev=data.invoices.filter(inv=>inv.date?.startsWith(key)&&inv.paymentStatus!=='cancelled').reduce((s,inv)=>s+(+inv.grand||0),0)
    const col=data.invoices.filter(inv=>inv.date?.startsWith(key)&&inv.paymentStatus==='paid').reduce((s,inv)=>s+(+inv.grand||0),0)
      +data.invoices.filter(inv=>inv.date?.startsWith(key)&&inv.paymentStatus==='partial').reduce((s,inv)=>s+(+inv.amountPaid||0),0)
    months.push({key,label,rev,col})
  }

  const custMap={}
  active.forEach(i=>{if(i.customerName)custMap[i.customerName]=(custMap[i.customerName]||0)+(+i.grand||0)})
  const topCusts=Object.entries(custMap).sort((a,b)=>b[1]-a[1]).slice(0,5)

  const paidC=active.filter(i=>i.paymentStatus==='paid').length
  const partC=active.filter(i=>i.paymentStatus==='partial').length
  const pendC=active.filter(i=>i.paymentStatus==='pending').length

  // Chart.js refs
  const revRef=useRef(null);const revInst=useRef(null)
  const donutRef=useRef(null);const donutInst=useRef(null)

  useEffect(()=>{
    if(!revRef.current||typeof Chart==='undefined') return
    if(revInst.current) revInst.current.destroy()
    revInst.current=new Chart(revRef.current,{
      type:'bar',
      data:{
        labels:months.map(x=>x.label),
        datasets:[
          {label:'Billed',data:months.map(x=>x.rev),backgroundColor:'rgba(104,117,245,.18)',borderColor:'#6875f5',borderWidth:2,borderRadius:5,borderSkipped:false},
          {label:'Collected',data:months.map(x=>x.col),backgroundColor:months.map((_,i)=>['#4ade80','#6875f5','#fb923c','#fbbf24','#a78bfa','#38bdf8'][i%6]),borderWidth:0,borderRadius:5,borderSkipped:false}
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ₹${(c.raw||0).toLocaleString('en-IN')}`},backgroundColor:'#1a1d27',borderColor:'#2a2a34',borderWidth:1,titleColor:'#e8eaf2',bodyColor:'#818aa0'}},
        scales:{
          x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#818aa0',font:{size:11,family:'Manrope'}}},
          y:{grid:{color:'rgba(255,255,255,.04)'},border:{dash:[4,4]},ticks:{color:'#818aa0',font:{size:11},callback:v=>v>=1000?'₹'+(v/1000).toFixed(0)+'k':'₹'+v}}
        }
      }
    })
    return ()=>{if(revInst.current)revInst.current.destroy()}
  },[months.map(x=>x.rev+x.col).join(',')])

  useEffect(()=>{
    if(!donutRef.current||typeof Chart==='undefined') return
    if(donutInst.current) donutInst.current.destroy()
    donutInst.current=new Chart(donutRef.current,{
      type:'doughnut',
      data:{
        labels:['Paid','Partial','Pending'],
        datasets:[{data:[paidC,partC,pendC],backgroundColor:['#4ade80','#fb923c','#fbbf24'],borderColor:'#111114',borderWidth:3,hoverOffset:8}]
      },
      options:{
        responsive:true,maintainAspectRatio:false,cutout:'70%',
        plugins:{legend:{position:'bottom',labels:{color:'#818aa0',font:{size:11,family:'Manrope'},padding:12,usePointStyle:true,pointStyleWidth:8}},tooltip:{backgroundColor:'#1a1d27',borderColor:'#2a2a34',borderWidth:1,titleColor:'#e8eaf2',bodyColor:'#818aa0'}}
      }
    })
    return ()=>{if(donutInst.current)donutInst.current.destroy()}
  },[paidC,partC,pendC])

  const card={background:'#1a1d27',borderRadius:12,padding:'18px 20px',boxShadow:'0 1px 2px rgba(16,24,40,.06)',border:'1px solid #1e2235'}
  const ctitle={fontSize:11,fontWeight:700,color:'#818aa0',letterSpacing:'.08em',textTransform:'uppercase',marginBottom:14}
  const pC={paid:'#4ade80',partial:'#fb923c',pending:'#fbbf24',cancelled:'#636b82'}

  return <div style={{animation:'fadein .2s ease'}}>
    {/* Page header */}
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:20}}>
      <div>
        <div style={{fontSize:12,color:'#636b82',marginBottom:3,fontWeight:500}}>{['Good morning','Good afternoon','Good evening'][now.getHours()<12?0:now.getHours()<17?1:2]}</div>
        <h2 style={{fontSize:32,fontWeight:800,margin:0,color:'#e8eaf2',letterSpacing:'-.03em'}}>Overview</h2>
        <div style={{fontSize:12,color:'#636b82',marginTop:4}}>{now.toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div>
      </div>
      <PBtn onClick={()=>setTab('Invoices')} style={{fontSize:12}}>＋ New Invoice</PBtn>
    </div>

    {/* 6 Stat Cards */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:22}}>
      {[
        {l:'Revenue This Month',  v:fmt(mRev),                s:'All invoices issued this month'},
        {l:'Collected',           v:fmt(mCollected),           s:'Paid & partial payments'},
        {l:'Outstanding',         v:fmt(pendingDue),           s:'Pending across all invoices'},
        {l:'Open Job Cards',      v:openJ,                    s:'Active in workshop right now'},
        {l:'Overdue Invoices',    v:overdueInvs.length,       s:overdueInvs.length>0?`${overdueInvs.length} past due date`:'All on time'},
        {l:'Low Stock',           v:lowS,                     s:lowS>0?`${lowS} items below minimum`:'All stock sufficient'},
      ].map(({l,v,s})=><div key={l} style={{...card,cursor:'default'}}>
        <div style={{fontSize:11,fontWeight:600,color:'#636b82',letterSpacing:'.06em',textTransform:'uppercase',marginBottom:10}}>{l}</div>
        <div style={{fontSize:30,fontWeight:800,color:'#e8eaf2',lineHeight:1,marginBottom:6,letterSpacing:'-.03em'}}>{v}</div>
        <div style={{fontSize:11,color:'#4a5263'}}>{s}</div>
      </div>)}
    </div>

    {/* Charts Row */}
    <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:16,marginBottom:16,minWidth:0}}>

      {/* Revenue Chart (Chart.js) */}
      <div style={{...card,minWidth:0,overflow:'hidden'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <div style={ctitle}>Revenue — Last 6 Months</div>
          <div style={{display:'flex',gap:12}}>
            <div style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:'#818aa0'}}><div style={{width:9,height:9,borderRadius:2,background:'rgba(104,117,245,.3)',border:'1.5px solid #6875f5'}}/> Billed</div>
            <div style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:'#818aa0'}}><div style={{width:9,height:9,borderRadius:2,background:'#4ade80'}}/> Collected</div>
          </div>
        </div>
        <div style={{position:'relative',height:170,width:'100%',overflow:'hidden'}}><canvas ref={revRef} style={{width:'100%!important'}}/></div>
        <div style={{marginTop:10,paddingTop:10,borderTop:'1px solid #1e2235',display:'flex',justifyContent:'space-between',fontSize:11,color:'#818aa0'}}>
          <span>This month billed: <b style={{color:'#6875f5'}}>{fmt(mRev)}</b></span>
          <span>Collected: <b style={{color:'#4ade80'}}>{fmt(mCollected)}</b></span>
        </div>
      </div>

      {/* Payment Status Donut */}
      <div style={{...card,position:'relative',minWidth:0,overflow:'hidden'}}>
        <div style={ctitle}>Invoice Status</div>
        <div style={{position:'relative',height:170,width:'100%',overflow:'hidden'}}><canvas ref={donutRef} style={{width:'100%!important'}}/>
          {active.length===0&&<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',color:'#636b82',fontSize:12}}>No invoices yet</div>}
        </div>
        <div style={{marginTop:10,paddingTop:10,borderTop:'1px solid #1e2235',display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:4,textAlign:'center'}}>
          {[['Paid',paidC,'#4ade80'],['Partial',partC,'#fb923c'],['Pending',pendC,'#fbbf24']].map(([l,v,c])=><div key={l}><div style={{fontSize:18,fontWeight:800,color:c}}>{v}</div><div style={{fontSize:10,color:'#636b82',textTransform:'uppercase',letterSpacing:'.04em'}}>{l}</div></div>)}
        </div>
      </div>
    </div>

    {/* Top Customers */}
    <div style={{...card,marginBottom:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div style={ctitle}>Top Customers by Revenue</div>
        <button onClick={()=>setTab('Customers')} style={{fontSize:12,color:'#6875f5',background:'none',border:'none',cursor:'pointer',fontWeight:600}}>All →</button>
      </div>
      {topCusts.length===0
        ?<p style={{color:'#818aa0',fontSize:12,textAlign:'center',padding:'16px 0'}}>No invoices yet</p>
        :<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:12}}>
          {topCusts.map(([name,rev],i)=>{
            const colors=['#6875f5','#4ade80','#fb923c','#fbbf24','#a78bfa']
            const c=colors[i]||'#6875f5'
            return <div key={name} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:'#111114',borderRadius:8,border:'1px solid #1e2235'}}>
              <div style={{width:32,height:32,borderRadius:'50%',background:c+'22',border:'1.5px solid '+c+'55',display:'flex',alignItems:'center',justifyContent:'center',color:c,fontSize:13,fontWeight:700,flexShrink:0}}>{name[0].toUpperCase()}</div>
              <div style={{minWidth:0,flex:1}}>
                <div style={{fontSize:12,fontWeight:600,color:'#e8eaf2',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{name}</div>
                <div style={{fontSize:12,fontWeight:700,color:c,marginTop:2}}>{fmt(rev)}</div>
              </div>
              <div style={{fontSize:11,color:'#636b82',flexShrink:0}}>#{i+1}</div>
            </div>
          })}
        </div>
      }
    </div>

    {/* Needs Attention + Recent Invoices + Recent Jobs */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16}}>

      {/* Needs Attention */}
      <div style={card}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <div style={ctitle}>Needs Attention</div>
        </div>
        {lowS>0&&<div onClick={()=>setTab('Inventory')} style={{background:'#1e1000',border:'1px solid #7c3a00',borderRadius:8,padding:'9px 12px',marginBottom:8,fontSize:12,color:'#fb923c',cursor:'pointer',display:'flex',justifyContent:'space-between'}}>
          <span>⚠ {lowS} part{lowS>1?'s':''} low stock</span><span style={{fontWeight:700}}>Fix →</span>
        </div>}
        {overdueInvs.length===0&&lowS===0
          ?<div style={{textAlign:'center',padding:'20px 0',color:'#818aa0',fontSize:12}}>✓ Everything looks good</div>
          :overdueInvs.slice(0,4).map(i=><div key={i.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid #1e2235'}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:'#e8eaf2',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{i.customerName||'—'}</div>
              <div style={{fontSize:11,color:'#818aa0'}}>Due {fmtD(i.dueDate)}</div>
            </div>
            <span style={{fontSize:13,fontWeight:700,color:'#f87171',flexShrink:0,marginLeft:8}}>{fmt(i.grand)}</span>
          </div>)
        }
        {overdueInvs.length>4&&<button onClick={()=>setTab('Invoices')} style={{fontSize:12,color:'#6875f5',background:'none',border:'none',cursor:'pointer',marginTop:6}}>+{overdueInvs.length-4} more overdue →</button>}
      </div>

      {/* Recent Invoices */}
      <div style={card}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <div style={ctitle}>Recent Invoices</div>
          <button onClick={()=>setTab('Invoices')} style={{fontSize:12,color:'#6875f5',background:'none',border:'none',cursor:'pointer',fontWeight:600}}>All →</button>
        </div>
        {data.invoices.length===0
          ?<p style={{color:'#818aa0',fontSize:12,textAlign:'center',padding:'16px 0'}}>No invoices yet</p>
          :[...data.invoices].sort((a,b)=>(+b.invSerial||+b.id)-(+a.invSerial||+a.id)).slice(0,5).map(i=><div key={i.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 0',borderBottom:'1px solid #1e2235'}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:'#e8eaf2',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{i.customerName||'—'}</div>
              <div style={{fontSize:11,color:'#818aa0'}}>{fmtD(i.date)}{i.vehicleReg?` · ${i.vehicleReg}`:''}</div>
            </div>
            <div style={{textAlign:'right',flexShrink:0,marginLeft:8}}>
              <div style={{fontSize:13,fontWeight:700,color:'#e8eaf2'}}>{fmt(i.grand)}</div>
              <div style={{fontSize:10,fontWeight:700,color:pC[i.paymentStatus]||'#5c6576',textTransform:'uppercase'}}>{i.paymentStatus||'pending'}</div>
            </div>
          </div>)
        }
      </div>

      {/* Recent Job Cards */}
      <div style={card}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <div style={ctitle}>Recent Job Cards</div>
          <button onClick={()=>setTab('Job Cards')} style={{fontSize:12,color:'#6875f5',background:'none',border:'none',cursor:'pointer',fontWeight:600}}>All →</button>
        </div>
        {data.jobCards.length===0
          ?<p style={{color:'#818aa0',fontSize:12,textAlign:'center',padding:'16px 0'}}>No job cards yet</p>
          :data.jobCards.slice(0,5).map(j=><div key={j.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 0',borderBottom:'1px solid #1e2235'}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:'#e8eaf2',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{j.customerName||'—'}</div>
              <div style={{fontSize:11,color:'#818aa0'}}>{j.vehicleReg||'no vehicle'}</div>
            </div>
            <div style={{textAlign:'right',flexShrink:0,marginLeft:8}}>
              <Bdg s={j.status}/>
            </div>
          </div>)
        }
      </div>
    </div>
  </div>
}

/* ─── CUSTOMERS ─────────────────────────────────────── */
function Customers({data,db}){
  const[show,setShow]=useState(false);const[ed,setEd]=useState(null);const[q,setQ]=useState('')
  const blank={name:'',companyName:'',phone:'',email:'',address:'',gstin:'',type:'individual',notes:''}
  const[form,setForm]=useState(blank);const f=(k,v)=>setForm(p=>({...p,[k]:v}))
  function open(c){setEd(c||null);setForm(c?{...c}:blank);setShow(true)}
  async function doSave(){if(!form.name||!form.phone){alert('Name and phone required.');return}await db.saveCustomer(form);setShow(false)}
  const list=data.customers.filter(c=>!q||c.name?.toLowerCase().includes(q.toLowerCase())||c.phone?.includes(q))
  return <div>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
      <h2 style={{fontSize:22,fontWeight:800,margin:0,flex:1,color:'#e8eaf2',letterSpacing:'-.025em'}}>Customers</h2>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search name / phone…" style={{...IS,width:200}}/>
      <PBtn onClick={()=>open(null)}>+ Add Customer</PBtn>
    </div>
    <table><thead><tr>{['ID','Name','Phone','Email','Type','GSTIN','Actions'].map(h=><th key={h} style={TH}>{h}</th>)}</tr></thead>
    <tbody>{list.map(c=><tr key={c.id} style={{background:'#1a1d27'}}>
      <td style={{...TD,color:'#6875f5',fontWeight:700,fontFamily:'monospace',fontSize:12}}>C-{c.id}</td>
      <td style={{...TD,fontWeight:700}}>{c.name}{c.companyName&&<div style={{fontSize:11,color:'#9daabb',marginTop:2}}>{c.companyName}</div>}</td>
      <td style={{...TD,color:'#e8eaf2'}}>{c.phone}</td>
      <td style={{...TD,color:'#9daabb',fontSize:12}}>{c.email||'—'}</td>
      <td style={TD}><Bdg s={c.type||'individual'}/></td>
      <td style={{...TD,fontFamily:'monospace',fontSize:11,color:'#9daabb'}}>{c.gstin||'—'}</td>
      <td style={TD}>
        <button onClick={()=>open(c)} title="Edit" style={{marginRight:5,width:28,height:28,background:'#1e2235',border:'1px solid #252d3d',borderRadius:6,cursor:'pointer',fontSize:13,color:'#9daabb',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>✏</button>
        <button onClick={async()=>{if(confirm('Delete customer?'))await db.delCustomer(c.id)}} title="Delete" style={{width:28,height:28,background:'#2a0a10',border:'1px solid #7f1d1d',borderRadius:6,cursor:'pointer',fontSize:13,color:'#f87171',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>🗑</button>
      </td>
    </tr>)}</tbody></table>
    {list.length===0&&<p style={{textAlign:'center',color:'#636b82',padding:36}}>No customers yet.</p>}
    {show&&<Modal title={ed?'Edit Customer':'Add Customer'} onClose={()=>setShow(false)}>
      <FR>
        <F label="Full Name *" half><In value={form.name} onChange={e=>f('name',e.target.value)}/></F>
        <F label="Phone *" half><In value={form.phone||''} onChange={e=>f('phone',e.target.value)} placeholder="+91 XXXXX XXXXX"/></F>
        <F label="Email" half><In type="email" value={form.email||''} onChange={e=>f('email',e.target.value)}/></F>
        <F label="Type" half><Sl value={form.type||'individual'} onChange={e=>f('type',e.target.value)} opts={['individual','corporate','fleet']}/></F>
        <F label="Company Name"><In value={form.companyName||''} onChange={e=>f('companyName',e.target.value)} placeholder="Fleet or company name (if applicable)"/></F>
        <F label="GSTIN (Corporate)"><In value={form.gstin||''} onChange={e=>f('gstin',e.target.value)} placeholder="15-digit GSTIN"/></F>
        <F label="Address"><Tx value={form.address||''} onChange={e=>f('address',e.target.value)} style={{minHeight:52}}/></F>
        <F label="Notes"><Tx value={form.notes||''} onChange={e=>f('notes',e.target.value)} style={{minHeight:48}}/></F>
      </FR>
      <Btns onCancel={()=>setShow(false)} onSave={doSave} label={ed?'Update':'Save Customer'}/>
    </Modal>}
  </div>
}

/* ─── VEHICLES ──────────────────────────────────────── */
function Vehicles({data,db}){
  const[show,setShow]=useState(false);const[ed,setEd]=useState(null);const[q,setQ]=useState('')
  const blank={customerId:'',regNo:'',make:'',model:'',variant:'',year:'',vin:'',engineNo:'',color:'',fuelType:'petrol',odometer:'',insuranceExpiry:'',lastService:'',notes:''}
  const[form,setForm]=useState(blank);const f=(k,v)=>setForm(p=>({...p,[k]:v}))
  function open(v){setEd(v||null);setForm(v?{...v}:blank);setShow(true)}
  async function doSave(){if(!form.regNo||!form.make||!form.customerId){alert('Customer, Make and Reg No required.');return}await db.saveVehicle(form);setShow(false)}
  const list=data.vehicles.filter(v=>!q||v.regNo?.toLowerCase().includes(q.toLowerCase())||v.make?.toLowerCase().includes(q.toLowerCase()))
  const getCust=id=>data.customers.find(c=>c.id==id)
  return <div>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
      <h2 style={{fontSize:22,fontWeight:800,margin:0,flex:1,color:'#e8eaf2',letterSpacing:'-.025em'}}>Vehicles</h2>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search reg / make / customer…" style={{...IS,width:230}}/>
      <PBtn onClick={()=>open(null)}>+ Add Vehicle</PBtn>
    </div>
    <div style={{overflowX:'auto'}}>
      <table style={{minWidth:800}}><thead><tr>{['ID','Reg No.','Make / Model','Year','Fuel','Color','Customer','Odo.','Actions'].map(h=><th key={h} style={TH}>{h}</th>)}</tr></thead>
      <tbody>{list.map(v=><tr key={v.id} style={{background:'#1a1d27'}}>
        <td style={{...TD,color:'#6875f5',fontWeight:700,fontFamily:'monospace',fontSize:12}}>V-{v.id}</td>
        <td style={{...TD,fontWeight:900,fontSize:13,letterSpacing:'.03em'}}>{v.regNo}</td>
        <td style={{...TD,fontWeight:600}}>{v.make} {v.model}{v.variant&&<span style={{color:'#9daabb',fontWeight:400}}> {v.variant}</span>}</td>
        <td style={{...TD,color:'#9daabb'}}>{v.year||'—'}</td>
        <td style={TD}><Bdg s={v.fuelType||'petrol'}/></td>
        <td style={{...TD,color:'#9daabb',fontSize:12}}>{v.color||'—'}</td>
        <td style={{...TD,fontWeight:600}}>{getCust(v.customerId)?.name||'—'}</td>
        <td style={{...TD,color:'#9daabb',fontSize:12}}>{v.odometer?v.odometer+' km':'—'}</td>
        <td style={TD}>
          <button onClick={()=>open(v)} title="Edit" style={{marginRight:5,width:28,height:28,background:'#1e2235',border:'1px solid #252d3d',borderRadius:6,cursor:'pointer',fontSize:13,color:'#9daabb',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>✏</button>

        </td>

/* ─── INVENTORY ─────────────────────────────────────── */
function Inventory({data,db}){
  const[show,setShow]=useState(false);const[ed,setEd]=useState(null);const[q,setQ]=useState('');const[cat,setCat]=useState('');const[usage,setUsage]=useState(null)
  const[aiLoading,setAiLoading]=useState(false);const pdfRef=useRef(null)
  const blank={name:'',partNo:'',hsnCode:'',gst:18,purchasePrice:'',sellingPrice:'',qty:0,minQty:2,unit:'nos',category:'spare',rack:'',vehicleMake:'',vehicleModel:'',notes:''}
  const[form,setForm]=useState(blank);const f=(k,v)=>setForm(p=>({...p,[k]:v}))
  async function importFromPDF(file){
    setAiLoading(true)
    try{
      const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file)})
      const{data:resp,error}=await sb.functions.invoke('anthropic-proxy',{
        body:{
          model:'claude-haiku-4-5-20251001',max_tokens:2000,
          messages:[{role:'user',content:[
            {type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},
            {type:'text',text:`Extract all line items from this purchase/inventory invoice. Return ONLY a JSON array, no explanation:\n[{"name":"","partNo":"","hsnCode":"","gst":18,"qty":1,"unit":"nos","category":"spare","vehicleMake":"","vehicleModel":"","sellingPrice":0,"purchasePrice":0}]\nRules:\n- sellingPrice = taxable value PER UNIT (before GST). If total taxable for a line is given, divide by qty.\n- purchasePrice = total amount PER UNIT (taxable + GST). If total is given, divide by qty.\n- vehicleMake = car brand this part fits (e.g. "Maruti Suzuki", "Hyundai"), empty string if universal\n- vehicleModel = car model this part fits (e.g. "Swift", "i20"), empty string if universal or multi-model\n- category must be one of: spare,consumable,accessory,lubricant,tyre,electrical,body,other\n- unit must be one of: nos,litre,set,pair,kg,ml,mtr,box`}
          ]}]
        }
      })
      if(error) throw new Error(error.message||'Edge Function not set up. See Settings → AI Setup.')
      if(!resp?.content?.length) throw new Error(resp?.error?.message||'Unexpected AI response — check Edge Function includes anthropic-beta: pdfs-2024-09-25 header.')
      const text=resp.content[0].text
      const json=JSON.parse(text.match(/\[[\s\S]*\]/)[0])
      const n0=v=>v===''||v==null?0:+v
      let created=0,updated=0
      for(let _j=0;_j<json.length;_j++){
        const it=json[_j]
        if(!it.name||!it.name.trim()) continue
        const existing=data.parts.find(p=>p.name.toLowerCase().trim()===it.name.toLowerCase().trim())
        if(existing){
          await db.savePart({...existing,qty:(+existing.qty||0)+(n0(it.qty)||1),sellingPrice:n0(it.sellingPrice)||+existing.sellingPrice||0,purchasePrice:n0(it.purchasePrice)||+existing.purchasePrice||0,partNo:it.partNo||existing.partNo||'',hsnCode:it.hsnCode||existing.hsnCode||'',gst:n0(it.gst)||+existing.gst||18,vehicleMake:it.vehicleMake||existing.vehicleMake||'',vehicleModel:it.vehicleModel||existing.vehicleModel||''})
          updated++
        }else{
          await db.savePart({name:it.name.trim(),partNo:it.partNo||'',hsnCode:it.hsnCode||'',gst:n0(it.gst)||18,qty:n0(it.qty)||0,minQty:2,unit:it.unit||'nos',category:it.category||'spare',rack:'',vehicleMake:it.vehicleMake||'',vehicleModel:it.vehicleModel||'',notes:'',sellingPrice:n0(it.sellingPrice),purchasePrice:n0(it.purchasePrice)})
          created++
        }
      }
      alert(`✓ AI imported ${json.length} item(s):\n• ${created} new part(s) added\n• ${updated} existing part(s) updated (qty added)`)
    }catch(e){alert('AI import failed: '+e.message)}
    setAiLoading(false)
  }
  function open(p){setEd(p||null);setForm(p?{...p}:blank);setShow(true)}
  function autoHSN(){
    const n=form.name.toLowerCase()
    let m=Object.entries(HSN).find(([k])=>k.toLowerCase()===n)
    if(!m)m=Object.entries(HSN).find(([k])=>n.includes(k.toLowerCase())||k.toLowerCase().includes(n))
    if(m){setForm(p=>({...p,hsnCode:m[1].h,gst:m[1].g}));alert(`✓ Found!\nHSN: ${m[1].h}  |  GST: ${m[1].g}%`)}
    else alert('Not in HSN database.\n\nCommon codes:\n• Brakes/Suspension: 87083000 @ 28%\n• Filters: 84212300 @ 18%\n• Battery: 85072000 @ 28%\n• Engine parts: 84099200 @ 28%\n• Tyres: 40111000 @ 28%\n• Engine Oil/Fluids: 27101980 @ 18%')
  }
  async function doSave(){
    if(!form.name){alert('Part name is required.');return}
    const n0=v=>v===''||v==null?0:+v
    await db.savePart({...form,sellingPrice:n0(form.sellingPrice),purchasePrice:n0(form.purchasePrice),gst:n0(form.gst)||18,qty:n0(form.qty),minQty:n0(form.minQty)||2})
    setShow(false)
  }
  const list=data.parts.filter(p=>(!q||p.name?.toLowerCase().includes(q.toLowerCase())||p.partNo?.includes(q))&&(!cat||p.category===cat))
  const low=data.parts.filter(p=>(+p.qty||0)<=(+p.minQty||2)).length
  return <div>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16,flexWrap:'wrap'}}>

      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search part…" style={{...IS,width:160}}/>
      <select value={cat} onChange={e=>setCat(e.target.value)} style={{...IS,width:150}}>
        <option value="">All Categories</option>
        {['spare','consumable','accessory','lubricant','tyre','electrical','body','other'].map(c=><option key={c} value={c}>{c.charAt(0).toUpperCase()+c.slice(1)}</option>)}
      </select>
      <input ref={pdfRef} type="file" accept=".pdf" style={{display:'none'}} onChange={e=>{if(e.target.files[0])importFromPDF(e.target.files[0]);e.target.value=''}}/>
      <PBtn onClick={()=>pdfRef.current?.click()} col={aiLoading?'#999':'#1b5e20'} style={{whiteSpace:'nowrap'}}>{aiLoading?'⏳ AI Processing…':'📎 Import from PDF'}</PBtn>
      <PBtn onClick={()=>open(null)}>+ Add Part</PBtn>
    </div>
    {low>0&&<div style={{background:'#2a1400',border:'1px solid #7c3a00',borderRadius:8,padding:'9px 16px',marginBottom:14,fontSize:12,color:'#fb923c'}}>⚠ <b>{low} part{low>1?'s':''}</b> at or below minimum stock level.</div>}
    <div style={{overflowX:'auto'}}>
      <table style={{minWidth:960}}><thead><tr>{['Part Name','Part No.','Make / Model','Category','HSN Code','GST','Sell Price','Buy Price','Stock','Min','Actions'].map(h=><th key={h} style={TH}>{h}</th>)}</tr></thead>
      <tbody>{list.map(p=>{const low=(+p.qty||0)<=(+p.minQty||2);return<tr key={p.id} style={{background:low?'#1e0f00':'#1a1d27'}}>
        <td style={{...TD,fontWeight:700}}>{p.name}</td>
        <td style={{...TD,fontFamily:'monospace',fontSize:11,color:'#9daabb'}}>{p.partNo||'—'}</td>
        <td style={{...TD,fontSize:12,color:'#9daabb'}}>{[p.vehicleMake,p.vehicleModel].filter(Boolean).join(' ')||'—'}</td>
        <td style={TD}><Bdg s={p.category||'spare'}/></td>
        <td style={{...TD,fontFamily:'monospace',fontSize:11,color:'#9daabb'}}>{p.hsnCode||'—'}</td>
        <td style={TD}>{p.gst}%</td>
        <td style={{...TD,fontWeight:700}}>{fmt(p.sellingPrice)}</td>
        <td style={{...TD,color:'#9daabb'}}>{fmt(p.purchasePrice)}</td>
        <td style={{...TD,fontWeight:700,color:low?'#f87171':'#4ade80'}}>{p.qty||0} {p.unit}</td>
        <td style={{...TD,color:'#9daabb'}}>{p.minQty||2}</td>
        <td style={TD}>
          <button onClick={()=>setUsage(p)} title="Usage history" style={{marginRight:4,width:28,height:28,background:'#0d1a30',border:'1px solid #1e2d52',borderRadius:5,cursor:'pointer',fontSize:12,color:'#6875f5',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>📊</button>
          <button onClick={()=>open(p)} title="Edit" style={{marginRight:4,width:28,height:28,background:'#1e2235',border:'1px solid #252d3d',borderRadius:5,cursor:'pointer',fontSize:12,color:'#9daabb',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>✏</button>
          <button onClick={async()=>{if(confirm('Delete?'))await db.delPart(p.id)}} title="Delete" style={{width:28,height:28,background:'#2a0a10',border:'1px solid #7f1d1d',borderRadius:5,cursor:'pointer',fontSize:12,color:'#f87171',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>🗑</button>
        </td>
      </tr>})}</tbody></table>
    </div>
    {list.length===0&&<p style={{textAlign:'center',color:'#636b82',padding:36}}>No parts yet.</p>}
    {usage&&<Modal title={`Usage History — ${usage.name}`} onClose={()=>setUsage(null)}>
      {(()=>{
        const rows=(data.invoices||[]).flatMap(inv=>{
          const its=(inv.items||[]).filter(it=>!it.isService&&(it.partId===usage.id||it.name===usage.name))
          return its.map(it=>({invNo:buildInvNo(data.settings||{},inv),date:inv.date,customer:inv.customerName||'—',qty:+it.qty||0,rate:+it.rate||0}))
        }).sort((a,b)=>(b.date||'').localeCompare(a.date||''))
        const totalQty=rows.reduce((s,r)=>s+r.qty,0)
        if(!rows.length)return <p style={{color:'#636b82',textAlign:'center',padding:20}}>No usage found in any invoice.</p>
        return <div>
          <div style={{background:'#0a2010',border:'1px solid #1a5c2a',borderRadius:7,padding:'8px 14px',marginBottom:14,fontSize:12}}>
            Total issued: <b>{totalQty} {usage.unit}</b> across <b>{rows.length}</b> invoice(s) &nbsp;|&nbsp; Current stock: <b>{usage.qty||0} {usage.unit}</b>
          </div>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead><tr>{['Invoice No.','Date','Customer','Qty','Rate','Amount'].map(h=><th key={h} style={TH}>{h}</th>)}</tr></thead>

              <td style={TD}>{fmtD(r.date)}</td>
              <td style={TD}>{r.customer}</td>
              <td style={{...TD,textAlign:'center'}}>{r.qty} {usage.unit}</td>

              <td style={{...TD,fontWeight:700}}>{fmt(r.qty*r.rate)}</td>
            </tr>)}</tbody>
          </table>
        </div>
      })()}
    </Modal>}
    {show&&<Modal title={ed?'Edit Part':'Add Part'} onClose={()=>setShow(false)}>
      <FR>
        <F label="Part Name *" half><In value={form.name||''} onChange={e=>f('name',e.target.value)} placeholder="e.g. Brake Pad, Oil Filter"/></F>

          <button onClick={()=>open(j)} style={{padding:'3px 8px',border:'1px solid #252d3d',borderRadius:5,cursor:'pointer',fontSize:11}}>✏</button>
          <button onClick={()=>genInv(j,'estimate')} style={{padding:'3px 7px',background:'#2a0d14',color:'#f48fb1',border:'1px solid #880e4f',borderRadius:5,cursor:'pointer',fontSize:10,fontWeight:700}}>EST</button>
          <button onClick={()=>genInv(j,'invoice')} style={{padding:'3px 7px',background:'#0d1a30',color:'#90caf9',border:'1px solid #1565c0',borderRadius:5,cursor:'pointer',fontSize:10,fontWeight:700}}>INV</button>
          <button onClick={()=>genInv(j,'final-invoice')} style={{padding:'3px 7px',background:'#0a2010',color:'#4ade80',border:'1px solid #1a5c2a',borderRadius:5,cursor:'pointer',fontSize:10,fontWeight:700}}>FINAL</button>
          <button onClick={async()=>{if(confirm('Delete?'))await db.delJob(j.id)}} style={{padding:'3px 8px',border:'1px solid #7f1d1d',borderRadius:5,cursor:'pointer',fontSize:11,color:'#f87171'}}>🗑</button>
        </div></td>
      </tr>)}</tbody></table>
    </div>
    {list.length===0&&<p style={{textAlign:'center',color:'#636b82',padding:36}}>No job cards yet.</p>}
    {show&&<Modal title={ed?'Edit Job Card':'New Job Card'} onClose={()=>{setShow(false);setEd(null)}} wide><JobForm initial={ed} data={data} onSave={doSave} onClose={()=>{setShow(false);setEd(null)}}/></Modal>}
    {newInv&&<Modal title="Generate Invoice from Job Card" onClose={()=>setNewInv(null)} wide><InvEditor initial={newInv} data={data} onSave={saveNewInv} onClose={()=>setNewInv(null)}/></Modal>}
  </div>
}

/* ─── INVOICES ──────────────────────────────────────── */
function Invoices({data,db}){
  const[sub,setSub]=useState('all')
  const[showNew,setShowNew]=useState(false);const[editI,setEditI]=useState(null);const[printI,setPrintI]=useState(null)
  const[q,setQ]=useState('');const[fType,setFType]=useState('all');const[fStatus,setFStatus]=useState('all');const[sort,setSort]=useState('serial-desc');const[fCust,setFCust]=useState('all')
  const TABS=[{k:'all',l:'All Invoices'},{k:'estimate',l:'Estimates'},{k:'invoice',l:'Tax Invoices'},{k:'final-invoice',l:'Final Invoices'}]
  const pC={paid:'#0a1f0d|#4ade80',partial:'#1a1200|#fb923c',pending:'#1c1500|#fbbf24',cancelled:'#2a0a10|#f87171'}
  const docInfo=i=>{
    if(i.paymentStatus==='cancelled') return {label:'Cancelled',bg:'#2a0a10',fg:'#f87171'}
    if(i.type==='estimate') return {label:'Estimate',bg:'#0d1a30',fg:'#6875f5'}
    if(i.type==='final-invoice') return {label:'Final',bg:'#1a0f2a',fg:'#a78bfa'}
    return {label:'Tax Inv.',bg:'#0a1f0d',fg:'#4ade80'}
  }
  const AC=['#4f63d2','#6875f5','#1b6e44','#8f5300','#b02e2b','#6d3db7']
  const ava=name=>{const n=name||'?';return{l:n[0].toUpperCase(),c:AC[n.charCodeAt(0)%AC.length]}}
  const matches=i=>{
    const custOk=fCust==='all'||(i.customerName||'')===(fCust)
    if(!custOk) return false
    if(!q) return true
    const ql=q.toLowerCase()
    return (i.customerName||'').toLowerCase().includes(ql)||(i.vehicleReg||'').toLowerCase().includes(ql)||String(i.id).includes(q)||buildInvNo(data.settings||DEF,i).toLowerCase().includes(ql)||(i.customerPhone||'').includes(q)
  }
  const list=sub==='all'
    ?data.invoices.filter(i=>matches(i)&&(fType==='all'||i.type===fType)&&(fStatus==='all'||i.paymentStatus===fStatus))
    :data.invoices.filter(i=>i.type===sub&&matches(i))
  const sortedList=[...list].sort(function(a,b){
    var va,vb
    if(sort==='serial-asc'||sort==='serial-desc'){va=(+a.invSerial||+a.id||0);vb=(+b.invSerial||+b.id||0)}
    else if(sort==='date-asc'||sort==='date-desc'){va=a.date||'';vb=b.date||''}
    else if(sort==='amount-asc'||sort==='amount-desc'){va=+a.grand||0;vb=+b.grand||0}
    else{va=(a.customerName||'').toLowerCase();vb=(b.customerName||'').toLowerCase()}
    var dir=(sort.endsWith('desc'))?-1:1
    return va<vb?-dir:va>vb?dir:0
  })
  const active=list.filter(i=>i.paymentStatus!=='cancelled')
  const total=active.reduce((s,i)=>s+(+i.grand||0),0)
  const collected=active.filter(i=>i.paymentStatus==='paid').reduce((s,i)=>s+(+i.grand||0),0)
    +active.filter(i=>i.paymentStatus==='partial').reduce((s,i)=>s+(+i.amountPaid||0),0)
  async function doCancel(inv){
    if(!confirm('Cancel invoice '+buildInvNo(data.settings||DEF,inv)+'? The invoice number will be preserved.')) return
    await db.cancelInvoice(inv.id)
  }
  const tabCount=t=>t==='all'?data.invoices.length:data.invoices.filter(i=>i.type===t).length
  const custNames=[...new Set(data.invoices.map(i=>i.customerName).filter(Boolean))].sort()
  function doExport(){
    const headers=['Invoice No','Date','Customer','Phone','Vehicle Reg','Doc Type','Amount (₹)','Payment Status','Payment Method','Amount Paid (₹)']
    const rows=sortedList.map(i=>[
      buildInvNo(data.settings||DEF,i),
      i.date||'',
      i.customerName||'',
      i.customerPhone||'',
      i.vehicleReg||'',
      docInfo(i).label,
      Number(i.grand||0).toFixed(2),
      i.paymentStatus||'',
      i.paymentMethod||'',
      Number(i.amountPaid||0).toFixed(2)
    ])
    const tag=fCust!=='all'?fCust.replace(/\s+/g,'_'):'All'
    downloadCSV('Invoices_'+tag+'_'+today()+'.csv',headers,rows)
  }
  return <div>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16,flexWrap:'wrap'}}>
      <h2 style={{fontSize:22,fontWeight:800,margin:0,flex:1,color:'#e8eaf2',letterSpacing:'-.025em'}}>Billing &amp; Invoices</h2>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search customer / vehicle / phone / #…" style={{...IS,width:220}}/>
      <button onClick={doExport} title="Export current view as CSV (opens in Excel)" style={{padding:'7px 14px',background:'#0a1a0f',color:'#4ade80',border:'1px solid #166534',borderRadius:7,cursor:'pointer',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:5,whiteSpace:'nowrap'}}>⬇ Export CSV</button>
      <PBtn onClick={()=>setShowNew(true)}>+ New Invoice / Estimate</PBtn>
    </div>
    <div style={{display:'flex',gap:2,marginBottom:14,background:'#1e2235',borderRadius:9,padding:3,width:'fit-content',flexWrap:'wrap'}}>
      {TABS.map(t=><button key={t.k} onClick={()=>{setSub(t.k);setFType('all');setFStatus('all')}} style={{padding:'7px 16px',border:'none',borderRadius:7,cursor:'pointer',background:sub===t.k?'#4f63d2':'transparent',color:sub===t.k?'#ffffff':'#636b82',fontWeight:sub===t.k?600:500,fontSize:13}}>{t.l} <span style={{fontSize:11,opacity:.7}}>({tabCount(t.k)})</span></button>)}
    </div>
    <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
      <span style={{fontSize:12,color:'#818aa0',fontWeight:600}}>Customer:</span>
      <select value={fCust} onChange={e=>setFCust(e.target.value)} style={{...IS,width:'auto',fontSize:12,padding:'5px 8px',maxWidth:200}}>
        <option value="all">All Customers</option>
        {custNames.map(n=><option key={n} value={n}>{n}</option>)}
      </select>
      {sub==='all'&&<span style={{fontSize:12,color:'#818aa0',fontWeight:600,marginLeft:4}}>Filter:</span>}
      {sub==='all'&&<select value={fType} onChange={e=>setFType(e.target.value)} style={{...IS,width:'auto',fontSize:12,padding:'5px 8px'}}>
        <option value="all">All Types</option>
        <option value="estimate">Estimate</option>
        <option value="invoice">Tax Invoice</option>
        <option value="final-invoice">Final Invoice</option>
      </select>}
      {sub==='all'&&<select value={fStatus} onChange={e=>setFStatus(e.target.value)} style={{...IS,width:'auto',fontSize:12,padding:'5px 8px'}}>
        <option value="all">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="partial">Partial</option>
        <option value="paid">Paid</option>
        <option value="cancelled">Cancelled</option>
      </select>}
      {(fCust!=='all'||fType!=='all'||fStatus!=='all')&&<button onClick={()=>{setFCust('all');setFType('all');setFStatus('all')}} style={{fontSize:11,color:'#f87171',background:'#2a0a10',border:'1px solid #7f1d1d',borderRadius:5,padding:'4px 8px',cursor:'pointer'}}>✕ Clear</button>}
      <span style={{fontSize:12,color:'#818aa0',fontWeight:600,marginLeft:4}}>Sort:</span>
      <select value={sort} onChange={e=>setSort(e.target.value)} style={{...IS,width:'auto',fontSize:12,padding:'5px 8px'}}>
        <option value="serial-asc">Invoice # ↑ (oldest first)</option>
        <option value="serial-desc">Invoice # ↓ (newest first)</option>
        <option value="date-desc">Date: Newest first</option>
        <option value="date-asc">Date: Oldest first</option>
        <option value="amount-desc">Amount: High to Low</option>
        <option value="amount-asc">Amount: Low to High</option>
        <option value="customer-asc">Customer: A → Z</option>
      </select>
    </div>
    {list.length>0&&<div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
      {fCust!=='all'&&<div style={{background:'#0d1a30',border:'1px solid #1e40af',borderRadius:8,padding:'7px 16px',fontSize:12,fontWeight:700,color:'#6875f5'}}>👤 {fCust} — {list.length} invoice{list.length!==1?'s':''}</div>}
      {[['Active Billed',total,'#0d1a30','#6875f5'],['Collected',collected,'#0a1f0d','#4ade80'],['Outstanding',total-collected,'#1c1500','#fbbf24']].map(([l,v,bg,fg])=><div key={l} style={{background:bg,border:`1px solid ${fg}33`,borderRadius:8,padding:'7px 16px',fontSize:12}}><span style={{color:'#818aa0'}}>{l}: </span><b style={{color:fg,fontSize:13}}>{fmt(v)}</b></div>)}
      {list.filter(i=>i.paymentStatus==='cancelled').length>0&&<div style={{background:'#2a0a10',borderRadius:8,padding:'7px 16px',fontSize:12}}><span style={{color:'#818aa0'}}>Cancelled: </span><b style={{color:'#f87171',fontSize:13}}>{list.filter(i=>i.paymentStatus==='cancelled').length}</b></div>}
    </div>}
    <div style={{overflowX:'auto'}}>
    <table style={{minWidth:800}}><thead><tr>
      {['Invoice','Customer','Vehicle','Date','Amount','Status','Actions'].map(h=><th key={h} style={TH}>{h}</th>)}
    </tr></thead>
    <tbody>{sortedList.map(inv=>{
      const cancelled=inv.paymentStatus==='cancelled'
      const paid=inv.paymentStatus==='paid'
      const[pbg,pfg]=(pC[inv.paymentStatus]||'#1a1d27|#818aa0').split('|')
      const di=docInfo(inv)
      const av=ava(inv.customerName)
      return <tr key={inv.id} style={cancelled?{opacity:.55,background:'#160a0a'}:{}}>
        <td style={{...TD,paddingTop:12,paddingBottom:12}}>
          <div style={{color:'#6875f5',fontWeight:700,fontSize:13,letterSpacing:'-.01em'}}>{buildInvNo(data.settings||DEF,inv)}</div>
          <div style={{fontSize:10,fontWeight:600,color:di.fg,background:di.bg,display:'inline-block',padding:'1px 6px',borderRadius:3,marginTop:3,lineHeight:'16px'}}>{di.label}</div>
        </td>
        <td style={{...TD,paddingTop:12,paddingBottom:12,minWidth:200}}>
          <div style={{display:'flex',alignItems:'center',gap:9}}>
            <div style={{width:30,height:30,borderRadius:'50%',background:av.c,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:12,fontWeight:700,flexShrink:0}}>{av.l}</div>
            <div>
              <div style={{fontWeight:600,color:'#e8eaf2',fontSize:13}}>{inv.customerName||'—'}</div>
              {inv.companyName&&<div style={{fontSize:10,color:'#636b82',marginTop:1}}>{inv.companyName}</div>}
            </div>
          </div>
        </td>
        <td style={{...TD,fontFamily:'monospace',fontSize:12,color:'#9daabb',letterSpacing:'.02em'}}>{inv.vehicleReg||'—'}</td>
        <td style={{...TD,color:'#818aa0',fontSize:12,whiteSpace:'nowrap'}}>{fmtD(inv.date)}</td>
        <td style={{...TD,fontWeight:700,fontSize:14,whiteSpace:'nowrap'}}>{fmt(inv.grand)}</td>
        <td style={TD}>{cancelled
          ?<span style={{fontSize:11,fontWeight:700,color:'#f87171',background:'#2a0a10',padding:'3px 9px',borderRadius:99,display:'inline-flex',alignItems:'center'}}>Cancelled</span>
          :<select value={inv.paymentStatus||'pending'} onChange={e=>db.markPay(inv.id,e.target.value)} style={{padding:'4px 10px',border:'1px solid #252d3d',borderRadius:8,fontSize:12,background:pbg,color:pfg,fontWeight:600,cursor:'pointer',width:'auto',outline:'none'}}><option value="pending">⏳ Pending</option><option value="partial">⚡ Partial</option><option value="paid">✓ Paid</option></select>
        }</td>
        <td style={TD}><div style={{display:'flex',gap:5,alignItems:'center'}}>
          <button onClick={()=>setPrintI(inv)} title="Print" style={{width:30,height:30,background:'#1e2235',color:'#9daabb',border:'1px solid #252d3d',borderRadius:6,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13}}>🖨</button>
          {!cancelled&&!paid&&<button onClick={()=>setEditI(inv)} title="Edit" style={{width:30,height:30,background:'#1e2235',color:'#9daabb',border:'1px solid #252d3d',borderRadius:6,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13}}>✏</button>}
          {!cancelled&&!paid&&<button onClick={()=>doCancel(inv)} title="Cancel invoice" style={{width:30,height:30,background:'#2a0a10',color:'#f87171',border:'1px solid #7f1d1d',borderRadius:6,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13}}>⊘</button>}
        </div></td>
      </tr>
    })}</tbody></table>
    </div>
    {list.length===0&&<p style={{textAlign:'center',color:'#818aa0',padding:36}}>No records found. {sub!=='all'&&<button onClick={()=>setShowNew(true)} style={{color:'#6875f5',background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>Create one →</button>}</p>}
    {showNew&&<Modal title="New Invoice / Estimate" onClose={()=>setShowNew(false)} wide light><div className="inv-form"><InvEditor data={data} onSave={async f=>{await db.saveInvoice(f);setShowNew(false)}} onClose={()=>setShowNew(false)} light={true}/></div></Modal>}
    {editI&&<Modal title={'Edit — '+buildInvNo(data.settings||DEF,editI)} onClose={()=>setEditI(null)} wide light><div className="inv-form"><InvEditor initial={editI} data={data} onSave={async f=>{await db.saveInvoice(f);setEditI(null)}} onClose={()=>setEditI(null)} light={true}/></div></Modal>}
    {printI&&<Modal title="Invoice Preview" onClose={()=>setPrintI(null)} wide><PrintDoc inv={printI} settings={data.D?.settings||data.settings} onClose={()=>setPrintI(null)}/></Modal>}
  </div>
}

function Settings({data,db}){

  const f=(k,v)=>setForm(p=>({...p,[k]:v}))
  async function doSave(){await db.saveSettings(form);setOk(true);setTimeout(()=>setOk(false),2500)}
  const sec={background:'#1a1d27',border:'1px solid #1e2235',borderRadius:10,padding:18,marginBottom:16}
  const stl={fontSize:13,fontWeight:700,color:'#e8eaf2',marginBottom:14,paddingBottom:10,borderBottom:'1px solid #1e2235'}

        <F label="UPI ID" half><In value={form.upiId||''} onChange={e=>f('upiId',e.target.value)} placeholder="name@upi"/></F>
      </FR>

        </F>
      </FR>
      {form.logoUrl&&<div style={{marginTop:8,display:'flex',alignItems:'center',gap:12}}>
        <img src={form.logoUrl} style={{height:64,maxWidth:180,objectFit:'contain',border:'1px solid #e0e0e0',borderRadius:6,padding:4}} alt="logo preview"/>
        <button onClick={()=>f('logoUrl','')} style={{padding:'4px 12px',background:'#2a0a10',color:'#f87171',border:'1px solid #7f1d1d',borderRadius:6,cursor:'pointer',fontSize:11}}>Remove Logo</button>
      </div>}
    </div>
    <div style={sec}><div style={stl}>🤖 AI Setup — PDF Import (one-time)</div>
      <div style={{fontSize:12,color:'#444',lineHeight:1.9,marginBottom:10}}>
        The AI PDF import calls Anthropic Claude via a <b>Supabase Edge Function</b> (avoids browser security restrictions). Set it up once in 3 steps:
      </div>
      <div style={{background:'#162040',border:'1px solid #2a3d80',borderRadius:8,padding:14,fontSize:11,lineHeight:2,color:'#e8eaf2'}}>
        <div><b style={{color:'#6875f5'}}>Step 1</b> — Open your <a href="https://supabase.com/dashboard" target="_blank" style={{color:'#6875f5',fontWeight:600}}>Supabase Dashboard</a> → Edge Functions → <b>New Function</b> → name it exactly: <code style={{background:'#1a2550',padding:'1px 6px',borderRadius:4}}>anthropic-proxy</code></div>
        <div><b style={{color:'#6875f5'}}>Step 2</b> — Paste this code into the editor and click Deploy:</div>
      </div>
      <pre style={{background:'#1a1a2e',color:'#e8eaf6',borderRadius:8,padding:14,fontSize:10,overflowX:'auto',margin:'8px 0',lineHeight:1.7,userSelect:'all'}}>{`import { serve } from "https://deno.land/std@0.168.0/http/server.ts"
const cors = { 'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type' }
serve(async (req) => {
  if (req.method === 'OPTIONS') return new Response('ok', { headers: cors })
  try {
    const body = await req.json()
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': Deno.env.get('ANTHROPIC_API_KEY'), 'anthropic-version': '2023-06-01', 'anthropic-beta': 'pdfs-2024-09-25' },
      body: JSON.stringify(body),
    })
    const data = await resp.json()
    return new Response(JSON.stringify(data), { headers: { ...cors, 'Content-Type': 'application/json' }, status: resp.status })
  } catch (e) {
    return new Response(JSON.stringify({ error: e.message }), { headers: { ...cors, 'Content-Type': 'application/json' }, status: 500 })
  }
})`}</pre>
      <div style={{background:'#162040',border:'1px solid #2a3d80',borderRadius:8,padding:14,fontSize:11,lineHeight:2,color:'#e8eaf2'}}>

        <div style={{marginTop:4,color:'#1b6e44',fontWeight:700}}>✓ Done! PDF import will work automatically after this.</div>
      </div>
    </div>
    <div style={sec}><div style={stl}>📄 Default Invoice Terms &amp; Conditions</div>
      <Tx value={form.invoiceTerms||''} onChange={e=>f('invoiceTerms',e.target.value)} style={{minHeight:100}}/>
    </div>
    <PBtn onClick={doSave} col={ok?'#0a3d1a':'#4f63d2'} style={{border:ok?'1px solid #4ade80':'none',color:ok?'#4ade80':'#fff'}}>{ok?'✓ Saved!':'Save Settings'}</PBtn>
    <div style={{...sec,marginTop:24}}>

/* ─── LOGIN SCREEN ──────────────────────────────────── */
function LoginScreen(){
  const[email,setEmail]=useState('')
  const[pass,setPass]=useState('')
  const[err,setErr]=useState('')
  const[loading,setLoading]=useState(false)
  async function doLogin(e){
    e.preventDefault(); setLoading(true); setErr('')
    const{error}=await sb.auth.signInWithPassword({email,password:pass})
    if(error) setErr(error.message)
    setLoading(false)
  }
  return <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'#0f0f14'}}>
    <div style={{background:'#1a1d27',borderRadius:16,padding:'40px 40px 36px',maxWidth:380,width:'100%',margin:16,boxShadow:'0 0 0 1px #1e2235,0 20px 56px -12px rgba(16,24,40,.22)'}}>

        <div style={{width:56,height:56,background:'#4f63d2',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',color:'#ffffff',fontSize:20,fontWeight:800,margin:'0 auto 16px',letterSpacing:'.4px'}}>FA</div>
        <div style={{fontSize:20,fontWeight:700,color:'#e8eaf2',letterSpacing:'-.025em'}}>Friends Automotive</div>
        <div style={{fontSize:13,color:'#818aa0',marginTop:5}}>Admin access only</div>
      </div>
      <form onSubmit={doLogin}>
        <div style={{marginBottom:14}}>
          <label style={{fontSize:11,fontWeight:600,color:'#636b82',display:'block',marginBottom:5,letterSpacing:'.04em',textTransform:'uppercase'}}>Email</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required autoFocus style={{width:'100%',padding:'10px 12px',border:'1px solid #252d3d',borderRadius:8,fontSize:13,outline:'none',boxSizing:'border-box',background:'#1a1d27',color:'#e8eaf2',fontFamily:"'Manrope',sans-serif"}} placeholder="admin@example.com"/>
        </div>
        <div style={{marginBottom:22}}>
          <label style={{fontSize:11,fontWeight:600,color:'#636b82',display:'block',marginBottom:5,letterSpacing:'.04em',textTransform:'uppercase'}}>Password</label>

        </div>
        {err&&<div style={{background:'#fbe6e4',color:'#f87171',padding:'10px 12px',borderRadius:8,fontSize:13,marginBottom:16,lineHeight:1.5}}>{err}</div>}
        <button type="submit" disabled={loading} style={{width:'100%',height:42,background:'#f0f2f8',color:'#0d0f14',border:'none',borderRadius:8,fontSize:14,fontWeight:600,cursor:'pointer',opacity:loading?.7:1,fontFamily:"'Manrope',sans-serif",letterSpacing:'-.01em'}}>
          {loading?'Signing in…':'Sign In'}
        </button>
      </form>
    </div>
  </div>
}

function App(){
  const[session,setSession]=useState(null)
  const[authChecked,setAuthChecked]=useState(false)
  const configured=!window.FA_SUPABASE_URL.includes('PASTE_')

  useEffect(()=>{
    if(!configured){setAuthChecked(true);return}
    sb.auth.getSession().then(({data:{session}})=>{setSession(session);setAuthChecked(true)})
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>setSession(s))
    return()=>subscription.unsubscribe()
  },[])

  if(!configured) return <SetupScreen/>
  if(!authChecked) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:16,background:'#0f0f14'}}>
    <div style={{width:44,height:44,border:'4px solid #1e2235',borderTop:'4px solid #4f63d2',borderRadius:'50%',animation:'spin .8s linear infinite'}}/>
    <div style={{fontSize:13,color:'#818aa0',fontWeight:500}}>Checking authentication…</div>
  </div>
  if(!session) return <LoginScreen/>
  return <AppShell onLogout={()=>sb.auth.signOut()}/>
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App))
</script>
